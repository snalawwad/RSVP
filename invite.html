<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>دعوة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://hexnxpufurftldpfcukd.supabase.co" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;600&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script defer src="config.js"></script>
<script defer src="core.js"></script>
</head>
<body>
<main>
  <div id="hero"></div>
  <div class="card" id="card"><p class="lead">جاري فتح الدعوة…</p></div>
  <p style="text-align:center;margin-top:18px;font-size:13px;color:var(--muted)" id="help"></p>
</main>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const { sb, $, esc, toast, fmtDate, fmtTime, applyTheme, calLink, icsBlobUrl } = App;
  const params = new URLSearchParams(location.search);
  const eventCode = params.get('e');
  let token = params.get('t') || (eventCode ? null : location.hash.slice(1));
  const KEY = eventCode ? 'rsvp-token-' + eventCode : null;
  if (KEY && !token) { try { token = localStorage.getItem(KEY); } catch (e) {} }
  let pub = null;
  const card = $('#card');
  let inv = null, mode = '', showOrig = false;
  const L = {
    ar: { hi: 'حياكم الله', date: 'التاريخ', time: 'الوقت', venue: 'المكان', seats: 'إجمالي الدعوات', yes: 'تأكيد الحضور', no: 'اعتذار', map: 'اللوكيشن', cal: 'أضف إلى التقويم',
      confirmed: 'تم تأكيد الحضور', ics: 'تحميل ملف التقويم (آيفون)', change: 'تغيير الرد', declined: 'تم تسجيل الاعتذار', miss: 'نتمنى نشوفكم بالأفراح دوم',
      why: 'نقدّر ردّكم، ممكن تخبرونا السبب؟', reasonPh: 'اكتبوا السبب هنا', reasonLbl: 'سبب الاعتذار', send: 'إرسال الاعتذار', back: 'رجوع', showCard: 'عرض بطاقة الدعوة', hideCard: 'إخفاء بطاقة الدعوة',
      card: 'بطاقة الدعوة', nameLbl: 'الاسم الكامل', namePh: 'اكتبوا اسمكم الكامل', nameReq: 'اكتبوا اسمكم الكامل أول', reply: 'تأكيد الحضور أو الاعتذار', saveErr: 'ما قدرنا نحفظ الرد، حاولوا مرة ثانية', help: 'تحتاجون مساعدة؟', helpLink: 'راسلونا على الواتساب', dear: '', rYes: 'بكل سرور، سأحضر', rNo: 'أعتذر عن الحضور', howMany: 'كم شخص بيحضر؟', howManySub: 'بما فيهم أنتم', people: n => n === 1 ? 'شخص واحد' : n === 2 ? 'شخصين' : n + ' أشخاص', comingN: n => 'الحضور: ' + (n === 1 ? 'شخص واحد' : n === 2 ? 'شخصين' : n + ' أشخاص'),
      closed: 'انتهى وقت تأكيد الحضور', closedSub: 'للاستفسار تواصلوا مع صاحبة الدعوة', locked: 'ما يمكن تغيير الرد لهذه المناسبة', linkClosed: 'رابط الدعوة مغلق حالياً' },
    en: { hi: 'You\u2019re invited', date: 'Date', time: 'Time', venue: 'Venue', seats: 'Invitations', yes: 'Confirm attendance', no: 'Decline', map: 'Location', cal: 'Add to calendar',
      confirmed: 'Attendance confirmed', ics: 'Download calendar file (iPhone)', change: 'Change my reply', declined: 'Your reply has been saved', miss: 'We\u2019ll miss you',
      why: 'We understand. Would you like to tell us why?', reasonPh: 'Type your reason here', reasonLbl: 'Reason for declining', send: 'Send reply', back: 'Back', showCard: 'View invitation card', hideCard: 'Hide invitation card',
      card: 'Invitation card', nameLbl: 'Your full name', namePh: 'Your full name', nameReq: 'Please type your full name first', reply: 'Will you be joining us?', saveErr: 'Your reply wasn\u2019t saved. Please try again.', help: 'Need help?', helpLink: 'Message us on WhatsApp', dear: 'Dear', rYes: 'Joyfully accept', rNo: 'Regretfully decline', howMany: 'How many of you are coming?', howManySub: 'Including you', people: n => n === 1 ? '1 person' : n + ' people', comingN: n => (n === 1 ? '1 person' : n + ' people') + ' coming',
      closed: 'RSVPs are now closed', closedSub: 'Please contact the host if you have a question.', locked: 'Replies for this event can\u2019t be changed', linkClosed: 'This invitation link is closed' }
  };
  let t = L.ar;
  const I = {
    user: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6"/></svg>',
    yes: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16.2 9.5"/></svg>',
    no: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
    cal: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="9" cy="14.5" r=".7" fill="currentColor"/><circle cx="12" cy="14.5" r=".7" fill="currentColor"/><circle cx="9" cy="17.3" r=".7" fill="currentColor"/><circle cx="12" cy="17.3" r=".7" fill="currentColor"/></svg>',
    pin: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 21s-6.5-5.8-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.2-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>'
  };

  function setHelp() {
    if (CONFIG.SUPPORT_WHATSAPP && !/X/.test(CONFIG.SUPPORT_WHATSAPP)) $('#help').innerHTML = `${t.help} <a href="https://wa.me/${esc(CONFIG.SUPPORT_WHATSAPP)}" style="color:inherit">${t.helpLink}</a>`;
  }

  async function load() {
    applyTheme(card); setHelp();
    if (!sb) { card.innerHTML = '<p class="lead">الموقع قيد الإعداد. This site is being set up.</p>'; return; }
    if (eventCode) {
      const r = await App.rpc2('get_event_public_v2', { p_code: eventCode }, 'get_event_public', { p_code: eventCode });
      if (r.error || !r.data) { card.innerHTML = '<p class="serif" style="font-size:24px;margin:0">الدعوة غير موجودة</p><p class="lead">Invitation not found. Please check the link you received on WhatsApp.</p>'; return; }
      pub = r.data;
      if (token) { const g = await App.rpc2('get_invite_v2', { p_token: token }, 'get_invite', { p_token: token }); if (!g.error && g.data) { inv = g.data; } else token = null; }
      if (!inv) inv = { name: '', seats: 1, status: 'pending', token: null, event: pub };
      const lang = pub.lang === 'en' ? 'en' : 'ar'; t = L[lang];
      document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
      document.title = pub.headline || pub.title || (lang === 'en' ? 'Invitation' : 'دعوة');
      applyTheme(card, pub.theme_accent, pub.theme_paper); setHelp(); render(); return;
    }
    if (!token) { card.innerHTML = '<p class="lead">الرابط ناقص. افتحوا الرابط اللي وصلكم على الواتساب.<br>This link is incomplete. Please open the link you received on WhatsApp.</p>'; return; }
    const { data, error } = await App.rpc2('get_invite_v2', { p_token: token }, 'get_invite', { p_token: token });
    if (error || !data) { card.innerHTML = '<p class="serif" style="font-size:24px;margin:0">الدعوة غير موجودة</p><p class="lead">Invitation not found. Please check the link you received on WhatsApp.</p>'; return; }
    inv = data;
    const lang = inv.event.lang === 'en' ? 'en' : 'ar';
    t = L[lang];
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    document.title = inv.event.headline || inv.event.title || (lang === 'en' ? 'Invitation' : 'دعوة');
    applyTheme(card, inv.event.theme_accent, inv.event.theme_paper); setHelp();
    render();
  }

  // Friendly text for the upgraded database's rule errors.
  function errText(err) {
    const m = (err && err.message) || '';
    if (/RSVP_CLOSED/.test(m)) return t.closed;
    if (/CHANGES_LOCKED/.test(m)) return t.locked;
    if (/LINK_CLOSED/.test(m)) return t.linkClosed;
    if (/NAME_REQUIRED/.test(m)) return t.nameReq;
    return t.saveErr;
  }
  let busy = false;
  async function respond(status, reason, count) {
    if (busy) return;
    if (eventCode) {
      if (status === 'pending') { mode = 'edit'; inv = { ...inv, status: 'pending' }; render(); return; }
      const nm = (($('#gname') && $('#gname').value) || inv.name || '').trim();
      if (nm.length < 2) { toast(t.nameReq); const n = $('#gname'); if (n) n.focus(); return; }
      busy = true;
      const args = { p_code: eventCode, p_name: nm, p_status: status, p_reason: reason || null, p_token: token };
      const r = await App.rpc2('public_rsvp_v2', args, 'public_rsvp', args);
      busy = false;
      if (r.error) { toast(errText(r.error)); return; }
      inv = r.data; token = inv.token; try { localStorage.setItem(KEY, token); } catch (e) {}
      mode = ''; render(); return;
    }
    busy = true;
    const r = await App.rpc2('respond_v2', { p_token: token, p_status: status, p_count: count || null, p_reason: reason || null },
      'respond', { p_token: token, p_status: status, p_reason: reason || null });
    busy = false;
    if (r.error) { toast(errText(r.error)); return; }
    inv = r.data; mode = ''; render();
  }
  // Guests with extras choose how many are coming (1..their seats). Only with the upgraded database.
  const canCount = () => !eventCode && inv.seats > 1 && 'confirmed_count' in inv;
  const isOpen = () => !inv.event || inv.event.rsvp_open !== false;
  const canChange = () => !inv.event || inv.event.allow_changes !== false;

  function render() {
    const e = inv.event, lang = e.lang === 'en' ? 'en' : 'ar';
    const cardMode = !!e.card_image_url;
    const links = `<div class="links">${e.map_url ? `<a href="${esc(e.map_url)}" target="_blank" rel="noopener">${I.pin}<span>${t.map}</span></a>` : ''}${e.starts_at ? `<a href="${calLink(e)}" target="_blank" rel="noopener">${I.cal}<span>${t.cal}</span></a>` : ''}</div>`;
    let body = '';
    if (inv.status === 'yes' && mode !== 'decline') {
      body = `<div class="state reveal"><div class="mark">✓</div><p class="serif" style="font-size:24px;margin:6px 0 0">${t.confirmed}</p>
        ${inv.seats > 1 && inv.confirmed_count ? `<p class="coming-n">${t.comingN(inv.confirmed_count)}</p>` : ''}</div>
        ${links}${e.starts_at ? `<p style="margin:10px 0 0"><a class="link" id="ics" download="invite.ics" href="#">${t.ics}</a></p>` : ''}
        ${isOpen() && canChange() ? `<button class="link" data-act="reset" style="margin-top:12px">${t.change}</button>` : ''}`;
    } else if (inv.status === 'no' && mode !== 'decline') {
      body = `<div class="state reveal"><div class="mark">✕</div><p class="serif" style="font-size:24px;margin:6px 0 0">${t.declined}</p><p class="lead">${t.miss}</p></div>
        ${isOpen() && canChange() ? `<button class="link" data-act="reset">${t.change}</button>` : ''}`;
    } else if (!isOpen()) {
      body = `<div class="state reveal"><p class="serif" style="font-size:24px;margin:6px 0 0">${t.closed}</p><p class="lead">${t.closedSub}</p></div>${links}`;
    } else if (eventCode && inv.event && inv.event.public_link_enabled === false && !inv.token) {
      body = `<div class="state reveal"><p class="serif" style="font-size:24px;margin:6px 0 0">${t.linkClosed}</p></div>${links}`;
    } else if (mode === 'count') {
      const n = inv.seats, picked = inv.confirmed_count || n;
      body = `<div class="reveal">${cardMode ? '<div class="rsvp-kicker"><span>RSVP</span></div>' : ''}<h2 class="rsvp-q" style="margin-bottom:4px">${t.howMany}</h2><p class="lead" style="margin:0 0 14px">${t.howManySub}</p>
        <div class="countpick" role="radiogroup" aria-label="${t.howMany}">${Array.from({ length: n }, (_, i) => i + 1).map(k => `<button type="button" role="radio" aria-checked="${k === picked}" data-n="${k}">${k}</button>`).join('')}</div>
        <div class="actions"><button class="btn" data-act="sendYes">${I.yes}<span id="cntLbl">${t.yes} · ${t.people(picked)}</span></button></div>
        <p style="margin:12px 0 0"><button class="link" data-act="back">${t.back}</button></p></div>`;
    } else if (mode === 'decline') {
      body = `<div class="reveal" style="text-align:start">${eventCode || cardMode ? '<div class="rsvp-kicker"><span>RSVP</span></div>' : ''}<p class="rsvp-why">${t.why}</p>
        <textarea id="reason" rows="4" placeholder="${t.reasonPh}" aria-label="${t.reasonLbl}"></textarea>
        <div class="actions"><button class="btn" data-act="sendNo">${t.send}</button><button class="btn ghost" data-act="back">${t.back}</button></div></div>`;
    } else {
      const noteLines = String(e.note || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
      const note = noteLines.length ? `<p class="rsvp-note">${noteLines.map(l => esc(l)).join('<br>')}</p>` : '';
      const nameField = !eventCode && cardMode ? `<div class="rsvp-kicker"><span>RSVP</span></div><h2 class="rsvp-q">${t.reply}</h2>${note}` : eventCode ? `<div class="rsvp-kicker"><span>RSVP</span></div><h2 class="rsvp-q">${t.reply}</h2>${note}
        <label class="namebox">${I.user}<input type="text" id="gname" aria-label="${t.nameLbl}" autocomplete="name" placeholder="${t.namePh}" value="${esc(inv.name || '')}"></label>` : '';
      body = `${nameField}<div class="actions"><button class="btn" data-act="yes">${I.yes}<span>${t.yes}</span></button><button class="btn ghost" data-act="no">${I.no}<span>${t.no}</span></button></div><div class="rsvp-rule"></div>${links}`;
    }
    const hasCard = !!e.card_image_url;
    const spot = (e.map_url && e.map_spot) ? String(e.map_spot).split(',').map(Number) : null;
    const spotLink = spot && spot.length === 4 && spot.every(n => isFinite(n)) ? `<a class="hero-map" href="${esc(e.map_url)}" target="_blank" rel="noopener" aria-label="${t.map}" style="left:${spot[0]}%;top:${spot[1]}%;width:${spot[2]}%;height:${spot[3]}%"></a>` : '';
    $('#hero').innerHTML = hasCard ? `<div class="hero-wrap"><img class="hero" src="${esc(e.card_image_url)}" alt="${t.card}">${spotLink}</div>` : '';
    card.classList.toggle('plain', hasCard);
    document.body.classList.toggle('has-card', hasCard);
    if (hasCard) card.style.setProperty('--t-paper', App.mix(e.theme_paper || '#F3D2B8', '#FBF3E8', .55));
    if (hasCard) document.body.style.setProperty('--page', App.mix(e.theme_accent || '#7A151C', '#000000', .55));
    const orig = '';
    card.innerHTML = `<p class="hayakum serif">${t.hi}</p>${inv.name ? `<p class="gname">${esc(inv.name)}</p>` : '<div style="height:14px"></div>'}
      ${e.invite_line ? `<p class="lead">${esc(e.invite_line)}</p>` : ''}
      ${e.headline ? `<p class="couple serif">${esc(e.headline)}</p>` : ''}
      <div class="when">${e.starts_at ? `<div><b>${t.date}</b>${esc(fmtDate(e.starts_at, lang))}</div><div><b>${t.time}</b>${esc(fmtTime(e.starts_at, lang))}</div>` : ''}${e.venue ? `<div style="grid-column:1/-1"><b>${t.venue}</b>${esc(e.venue)}</div>` : ''}</div>
      ${eventCode || (cardMode && inv.seats <= 1) ? '' : `<div class="seats"><span>${t.seats}</span><b>${inv.seats}</b></div>`}${body}${orig}`;

    const ics = $('#ics'); if (ics) ics.href = icsBlobUrl(e);

    bindActs();
  }

  function bindActs() {
    card.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'yes') { if (canCount()) { mode = 'count'; render(); } else respond('yes', null, 1); }
      if (a === 'sendYes') { const c = card.querySelector('.countpick [aria-checked="true"]'); respond('yes', null, c ? +c.dataset.n : inv.seats); }
      if (a === 'no') { if (eventCode) { const n = $('#gname'); const v = n ? n.value.trim() : inv.name; if (!v || v.length < 2) { toast(t.nameReq); if (n) n.focus(); return; } inv = { ...inv, name: v }; } mode = 'decline'; render(); const r = $('#reason'); if (r) r.focus(); }
      if (a === 'back') { mode = ''; render(); }
      if (a === 'reset') respond('pending');
      if (a === 'orig') { showOrig = !showOrig; render(); }
      if (a === 'sendNo') respond('no', $('#reason').value.trim());
    });
    card.querySelectorAll('.countpick button').forEach(b => b.onclick = () => {
      card.querySelectorAll('.countpick button').forEach(x => x.setAttribute('aria-checked', x === b));
      const l = $('#cntLbl'); if (l) l.textContent = `${t.yes} · ${t.people(+b.dataset.n)}`;
    });
  }

  load();
});
</script>
</body>
</html>
