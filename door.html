<script>
// Colour mode: the staff member's own choice wins. If they never chose, the door goes dark at night (Kuwait time).
try {
  var th = localStorage.getItem('ui-theme');
  if (!th) { var h = (new Date().getUTCHours() + 3) % 24; th = (h >= 17 || h < 5) ? 'dark' : 'light'; }
  document.documentElement.dataset.theme = th;
  if (localStorage.getItem('door-lang') === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
} catch (e) { document.documentElement.dataset.theme = 'auto'; }
</script>

  const codePart = q => /^sn([\s\-‐–]+\d{0,3}|\d{1,3})$/i.test(App.asciiDigits(q).trim());
  // score bands from App.nameScore: 5 same name · 4 starts with · 3 word starts · 2 inside · 1 other spelling/script · 0 close
  const tierOf = s => s >= 100 ? 5 : s >= 80 ? 4 : s >= 60 ? 3 : s >= 45 ? 2 : s >= 30 ? 1 : 0;
  function search(q) {
    const cq = codeQ(q);
    if (cq) {
      // the pass code first; 4 bare digits may also be part of a phone number
      const byCode = list.filter(g => g.pass_code === cq.code).map(g => ({ g, score: 120, tier: 6, code: true, phone: '' }));
      if (cq.sn) return byCode;
      return byCode.concat(list.filter(g => g.pass_code !== cq.code && (g.phone || '').includes(cq.code)).map(g => ({ g, score: 100, tier: 5, phone: cq.code })));
    }
    if (isDigits(q)) {
      const qd = App.asciiDigits(q).replace(/\D/g, '');
      return qd.length >= 4 ? list.filter(g => (g.phone || '').includes(qd)).map(g => ({ g, score: 100, tier: 5, phone: qd })) : [];
    }
    const tokens = nmap(q).n.split(' ').filter(Boolean);
    let hits = App.searchNames(list, q).map(({ item, score }) => ({ g: item, score, tier: tierOf(score), ranges: (matchName(item.name, tokens) || {}).ranges }));
    // last resort: the old letter-for-letter match, shown as a close spelling
    if (!hits.length) hits = list.map(g => ({ g, m: matchName(g.name, tokens) })).filter(x => x.m).map(x => ({ g: x.g, score: 1, tier: 0, ranges: x.m.ranges }));
    return hits;
  }

  // ---------- rows ----------
  const ORDER = { open: 0, part: 1, wait: 2, no: 3, all: 4 };
  function stateOf(g) {
    if (!v2) return g.checked_in_at ? 'all' : g.status === 'no' ? 'no' : g.status === 'pending' ? 'wait' : 'open';
    const done = g.checked_in_count || 0, left = leftOf(g);
    if (left > 0) return g.status === 'pending' ? 'wait' : done ? 'part' : 'open';
    return done ? 'all' : 'no';
  }
  const curN = g => { const left = leftOf(g); return Math.max(1, Math.min(left + MAX_OVER, typed[g.id] || left || 1)); };
  const lastReq = g => reqs.find(r => r.guest_id === g.id);     // newest first
  function actHtml(g) {
    const left = leftOf(g), n = curN(g);
    const stepper = `<div class="stepper" dir="ltr" role="group" aria-label="${esc(t.howMany)}"><button type="button" data-dec aria-label="${esc(t.less)}" ${n <= 1 ? 'disabled' : ''}>−</button><output id="n-${g.id}" aria-live="polite">${n}</output><button type="button" data-inc aria-label="${esc(t.more)}" ${n >= left + MAX_OVER ? 'disabled' : ''}>+</button></div>`;
    // over the allowance: check in the people allowed now, and ask the host about the rest
    if (n > left) return `<div class="door-act">${stepper}${ciBtn(g, t.checkInNow(left))}</div><div class="door-act one"><button class="btn secondary big block" type="button" data-askx="${g.id}">${esc(t.askAbout(n - left))}</button></div>`;
    return `<div class="door-act">${stepper}${ciBtn(g, t.checkInN(n, left))}</div>`;
  }
  function rowHtml(h) {
    const g = h.g, st = stateOf(g), done = g.checked_in_count || 0, left = leftOf(g), al = allowed(g);
    const phone = g.phone ? `<span class="d-ph num" dir="ltr">${h.phone ? markUp(showPhone(g.phone), (() => { const s = showPhone(g.phone), i = s.indexOf(h.phone); return i < 0 ? [] : [[i, i + h.phone.length]]; })()) : esc(showPhone(g.phone))}</span>` : '';
    const side = g.side ? `<bdi class="d-side">${esc(g.side)}</bdi>` : '';
    const top = `<div class="d-top">${mono(g.name, g.status === 'pending' ? 'wait' : g.status === 'no' ? 'no' : 'ok')}<b class="d-name"><bdi>${markUp(g.name, h.ranges)}</bdi></b>${phone}</div>`
      + (h.code && g.pass_code ? `<p class="d-pass"><i class="i i-qr sm" aria-hidden="true"></i><span>${t.passTag(`<bdi dir="ltr" class="num">${esc(App.passCode(g.pass_code))}</bdi>`)}</span></p>` : '');
    const rq = v2 && lastReq(g), rqLine = rq ? `<p class="d-req t-tone tone-${rq.status === 'approved' ? 'ok' : rq.status === 'rejected' ? 'no' : 'wait'}">${esc(t.reqLine[rq.status](rq.people))}</p>` : '';
    // already in: an amber card that says when, never a check-in button
    if (st === 'all') {
      const n = v2 ? done : g.seats;
      const ask = v2 ? `<div class="door-act one"><button class="btn secondary big block" type="button" data-ask="${g.id}">${esc(t.askAbout(extraAsk[g.id] || 1))}</button></div>` : '';
      return `<article class="drow st-all panel tone-wait${lang === 'ar' ? '' : ' wm'}" data-id="${g.id}">${top}<p class="d-already t-tone">${v2 ? t.already(n, tmHtml(g.checked_in_at)) : esc(t.alreadyOld) + (g.checked_in_at ? ' · ' + tmHtml(g.checked_in_at) : '')}</p>
        ${v2 ? `<p class="d-sub"><span>${esc(t.invited(g.seats, g.confirmed_count, g.status))}</span>${side ? `<span class="nw">· ${side}</span>` : ''}</p>` : ''}${rqLine}${ask}</article>`;
    }
    let tag, line = '';
    if (!v2) { tag = g.status === 'no' ? 'no' : g.status === 'pending' ? 'wait' : 'ok'; line = esc(P(g.seats)); }
    else if (st === 'no') tag = 'no';
    else { tag = st === 'wait' ? 'wait' : 'ok'; line = esc(done ? t.inLeft(done, left) : st === 'wait' ? t.upTo(left) : P(left)); }
    const tagTxt = { ok: t.coming, wait: t.noReply, no: t.declined }[tag];
    let act;
    if (!v2) act = `<div class="door-act one">${ciBtn(g, t.checkInN(g.seats, g.seats))}</div>`;
    else if (st === 'no') act = `<div class="door-act one"><button class="btn secondary big block" type="button" data-ask="${g.id}">${esc(t.askHost)}</button></div>`;
    else act = actHtml(g);
    return `<article class="drow st-${st}${lang === 'ar' ? '' : ' wm'}" data-id="${g.id}">${top}
      <p class="d-sub"><span class="tag tone-${tag}">${esc(tagTxt)}</span>${line ? `<span class="d-count">${line}</span>` : ''}${side}</p>
      ${g.status === 'no' && g.decline_reason ? `<p class="gi-why">${t.reason}: “<bdi>${esc(g.decline_reason)}</bdi>”</p>` : ''}${rqLine}
      ${act}</article>`;
  }
  // One filled (primary) button per screen: the first card's Check-in. The other cards' Check-in buttons are
  // outlined, and while a notice with its own main button is up, every card's button is outlined.
  function onePrimary() {
    let first = !$('#result .btn.primary');
    $('#list').querySelectorAll('[data-in]').forEach(b => { b.classList.toggle('primary', first); b.classList.toggle('secondary', !first); first = false; });
  }
  function ciBtn(g, label) {
    const b = busyId === g.id, f = failedId === g.id;
    return `<button class="btn primary big ci${f ? ' retry' : ''}" type="button" data-in="${g.id}" ${b ? 'aria-busy="true"' : ''}>${b ? t.busy : f ? t.retry : esc(label)}</button>`;
  }

  function renderList() {
    clearTimeout(renderLater);
    drawMeter();
    const raw = $('#q').value, q = raw.trim();
    $('#qx').hidden = !raw;
    // while a name is being typed the head tucks the title and meter away so results sit right under the search
    $('#door').classList.toggle('typing', !!q);
    $('.dmore').hidden = false;
    const L = $('#list'); L.classList.toggle('is-busy', !!busyId);
    if (!ev) { L.innerHTML = ''; return; }
    if (!q) { for (const k of Object.keys(typed)) delete typed[k]; L.innerHTML = idleHtml(); return; }
    // a phone number needs 4 digits: fewer is a quiet hint, not "not on the list"
    if (isDigits(q) && App.asciiDigits(q).replace(/\D/g, '').length < 4) { L.innerHTML = `<div class="didle dhint"><p>${t.digitsHint}</p></div>`; return; }
    if (codePart(q)) { L.innerHTML = `<div class="didle dhint"><p>${esc(t.codeHint)}</p></div>`; return; }
    const hits = search(q);
    if (hits.length) {
      const top = Math.max(...hits.map(h => h.tier)), phoneQ = isDigits(q) || !!codeQ(q);
      // "similar": every real match once 2+ letters are typed, in either script (مريم also finds Mariam); for a
      // phone, a whole number (8+ digits). Anyone from that set who is already inside comes first (amber, no
      // check-in button), so a similar not-yet-in name never sits on top of them. Phone numbers are unique
      // per event, so a phone search never gets the "similar names" line; nor does a single letter.
      const letters = phoneQ ? 0 : nmap(q).n.replace(/ /g, '').length;
      const sim = phoneQ ? (hits[0].phone.length >= 8 ? hits : []) : letters >= 2 ? hits.filter(h => h.tier >= 1) : hits.filter(h => h.tier === top && top >= 1);
      const simSet = new Set(sim);
      const inFirst = h => simSet.has(h) && stateOf(h.g) === 'all' ? 0 : 1;
      hits.sort((a, b) => inFirst(a) - inFirst(b) || b.tier - a.tier || ORDER[stateOf(a.g)] - ORDER[stateOf(b.g)] || b.score - a.score || a.g.name.localeCompare(b.g.name));
      const shown = hits.slice(0, 30);
      // forget a head count chosen for a guest who is no longer on screen (so it can't come back stale)
      const onScreen = new Set(shown.map(h => h.g.id));
      for (const k of Object.keys(typed)) if (!onScreen.has(k)) delete typed[k];
      let html = '';
      if (top === 0) html += `<p class="dnote">${esc(t.didYouMean)}</p>`;
      else if (sim.length > 1 && letters >= 2) html += `<p class="dnote tone-wait" role="status"><span class="dot tone-wait" aria-hidden="true"></span>${esc(t.ambiguous(sim.length))}</p>`;
      let divided = top === 0;
      for (const h of shown) {
        if (!divided && h.tier === 0) { html += `<p class="dnote">${esc(t.similar)}</p>`; divided = true; }
        html += rowHtml(h);
      }
      L.innerHTML = html; onePrimary(); return;
    }
    $('.dmore').hidden = v2;          // the not-found card already offers "Ask the host"
    L.innerHTML = v2
      ? `<div class="dnf"><p class="dnf-h">${t.notFoundH}</p><p class="dnf-s">${t.noOne(`<bdi>${esc(q)}</bdi>`)}</p><button class="btn primary big block" type="button" id="askQ"><i class="i i-bell"></i><span>${t.askHost}</span></button></div>`
      : `<div class="dnf"><p class="dnf-h">${t.notFoundH}</p><p class="dnf-s">${t.notFoundOld}</p></div>`;
  }
  function idleHtml() {
    // each row finds the guest again; a check-in made on this phone in the last 10 minutes can be undone from here too
    const recRow = (r, i) => `<div class="row rrow"><button type="button" class="rr-find row-link" data-recent="${esc(r.name)}">${mono(r.name)}<span class="row-main"><b class="t-name"><bdi>${esc(r.name)}</bdi></b><span class="t-small">${esc(P(r.n))}</span></span><span class="row-end t-small num">${tmHtml(r.at)}</span></button>${canUndoRec(r) ? `<button type="button" class="btn secondary rr-undo" data-undo-rec="${i}" aria-label="${esc(t.undo + ': ' + r.name)}">${esc(t.undo)}</button>` : ''}</div>`;
    const rec = recent.length ? `<h2 class="eyebrow d-cap">${t.justArrived}</h2><div class="rowlist rlist">${recent.map(recRow).join('')}</div><p class="help d-tip">${t.tapFind}</p>` : '';
    return rec + `<div class="didle"><i class="i i-arch di-arch" aria-hidden="true"></i><p>${t.typeName}</p>${wakeOn ? `<p class="d-awake"><i class="i i-moon sm"></i>${t.awake}</p>` : ''}</div>`;
  }
  const canUndoRec = r => !!r.u && v2 && undoOk === true && Date.now() - r.at < UNDO_MS;
  // a notice that waits for "Close" (over the limit, not on the list) goes once the next name is typed
  const clearStaticCard = () => { $('#result').innerHTML = ''; onePrimary(); };
  $('#q').addEventListener('input', () => { clearStaticCard(); renderList(); });
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { e.target.value = ''; renderList(); } });
  $('#qx').onclick = () => { $('#q').value = ''; renderList(); $('#q').focus(); };

  // one listener for every row action
  $('#list').addEventListener('click', e => {
    const row = e.target.closest('.drow'), g = row && list.find(x => x.id === row.dataset.id);
    const step = e.target.closest('[data-inc],[data-dec]');
    if (step && g) {
      const left = leftOf(g), n = Math.max(1, Math.min(left + MAX_OVER, curN(g) + (step.hasAttribute('data-inc') ? 1 : -1)));
      const wasOver = curN(g) > left;
      typed[g.id] = n; lastTouch = Date.now(); if (failedId === g.id) failedId = null;
      App.vibrate(8);
      if (wasOver !== n > left) { const cq = codeQ($('#q').value); row.outerHTML = rowHtml({ g, code: !!cq && g.pass_code === cq.code, ranges: matchName(g.name, nmap($('#q').value).n.split(' ').filter(Boolean))?.ranges }); onePrimary(); return; }
      row.querySelector('output').textContent = n;
      row.querySelector('[data-dec]').disabled = n <= 1; row.querySelector('[data-inc]').disabled = n >= left + MAX_OVER;
      const b = row.querySelector('[data-in]'); b.textContent = n > left ? t.checkInNow(left) : t.checkInN(n, left); b.classList.remove('retry');
      const ax = row.querySelector('[data-askx]'); if (ax) ax.textContent = t.askAbout(n - left);
      return;
    }
    const ci = e.target.closest('[data-in]');
    if (ci && g) {
      if (!v2) { checkIn(g.id); return; }
      const left = leftOf(g), n = curN(g);
      if (n > left) checkIn(g.id, left, n - left); else checkIn(g.id, n);
      return;
    }
    const ax = e.target.closest('[data-askx]');
    if (ax && g) { openAsk({ guest: g.id, name: g.name, people: Math.min(MAX_OVER, curN(g) - leftOf(g)) }); return; }
    const ask = e.target.closest('[data-ask]');
    if (ask && g) { openAsk({ guest: g.id, name: g.name, people: extraAsk[g.id] || 1 }); return; }
    const ur = e.target.closest('[data-undo-rec]');
    if (ur) { const r = recent[+ur.dataset.undoRec]; if (r && canUndoRec(r)) undoCheckIn({ id: r.id, name: r.name, n: r.n, at: r.at, q: r.q, undo: true }); return; }
    const rec = e.target.closest('[data-recent]');
    if (rec) { $('#q').value = rec.dataset.recent; renderList(); return; }
    if (e.target.closest('#askQ')) openAsk({ guest: null, name: $('#q').value.trim(), people: 1 });
  });

  // ---------- check in ----------
  // n: how many now; extra: people over the allowance still to ask the host about (keeps the guest on screen)
  async function checkIn(id, n, extra) {
    if (busy) return;
    const g = list.find(x => x.id === id); if (!g) return;
    clearStaticCard();
    busy = true; busyId = id; failedId = null; renderList();
    const before = g.checked_in_count || 0, wasIn = !!g.checked_in_at;
    if (v2) n = n || curN(g);
    let r;
    try {
      if (v2) {
        r = await sb.rpc('check_in_v2', { p_guest: id, p_people: n });
        if (r.error && App.missingFn(r.error)) { busy = false; busyId = null; dropV2(); loadList(); toast(t.err); return; }
      } else r = await sb.rpc('check_in_guest', { p_guest: id });
    } catch (e) { r = { error: { message: String(e) } }; }
    if (r.error && !r.error.code) {
      // no answer at all (venue Wi-Fi): the server may have saved it before the line dropped. Look again
      // before offering "Try again", so a second tap never counts the same people twice.
      await loadList();
      const f = list.find(x => x.id === id);
      if (f && (v2 ? (f.checked_in_count || 0) >= before + n : !wasIn && !!f.checked_in_at)) {
        busy = false; busyId = null; delete typed[id];
        if (v2 && extra) extraAsk[id] = extra;
        welcome({ id, name: f.name, n: v2 ? n : f.seats, left: v2 ? leftOf(f) : 0, status: f.status, at: Date.now(), undo: v2 }, !!extra);
        return;
      }
    }
    busy = false; busyId = null;
    if (r.error) { failedId = id; if (!r.error.code && Date.now() - lastOk > 3000) setLive(false); renderList(); toast(t.err); return; }
    delete typed[id];
    const d = r.data || {};
    if (d.ok && v2) { g.checked_in_count = d.arrived; g.checked_in_at = g.checked_in_at || new Date().toISOString(); if (extra) extraAsk[id] = extra; }
    else if (d.ok) g.checked_in_at = g.checked_in_at || new Date().toISOString();
    show(d, g, !!extra); loadList();
  }

  // a notice in the page (not fixed to the bottom, where the keyboard would cover it)
  function notice(tone, title, name, sub, buttons) {
    $('#result').innerHTML = `<div class="dnotice panel tone-${tone}" id="arrive"><p class="dn-k t-tone">${esc(title)}</p><b class="t-name"><bdi>${esc(name)}</bdi></b>${sub ? `<p class="dn-s">${esc(sub)}</p>` : ''}${buttons ? `<div class="dn-row">${buttons}</div>` : ''}</div>`;
    $('#result').querySelectorAll('[data-x]').forEach(b => b.onclick = clearStaticCard);
    onePrimary();
  }
  function welcome(info, keep) {
    App.vibrate(25);
    info.q = $('#q').value;                    // the search that found them, for Undo
    recent = [{ name: info.name, n: info.n, at: info.at, id: info.id, q: info.q, u: !!info.undo }].concat(recent.filter(r => r.id !== info.id)).slice(0, 6);
    if (ev) ss.set('door-recent-' + ev.id, recent);
    showBand(info);
    if (keep) { renderList(); return; }       // stays on screen, ready for "Ask host about +1"
    $('#q').value = ''; renderList(); $('#q').focus();
  }
  function show(r, g, keep) {
    if (v2) {
      // everyone on the invite is already in (another door, or a retry after a lost answer): say so plainly,
      // not "over the limit", so nobody asks the host for "extra" people who are really the same people
      if (!r.ok && r.reason === 'over' && !r.left && r.allowed > 0 && (r.arrived || 0) >= r.allowed) {
        if (g) g.checked_in_count = r.arrived;
        notice('wait', t.alreadyK(r.arrived), r.name, t.alreadyNow(r.arrived), `<button class="btn secondary" type="button" data-x>${t.closeNote}</button>`);
        renderList();
        return;
      }
      if (!r.ok && r.reason === 'over') {
        notice('wait', t.overK, r.name, r.left ? t.over(r.left) : t.overNone,
          (r.left ? `<button class="btn primary" type="button" id="inNow">${esc(t.checkInNow(r.left))}</button>` : '') + `<button class="btn ${r.left ? 'secondary' : 'primary'}" type="button" id="askNow">${t.askHost}</button><button class="btn quiet" type="button" data-x>${t.closeNote}</button>`);
        if ($('#inNow')) $('#inNow').onclick = () => { clearStaticCard(); checkIn(g.id, r.left); };
        $('#askNow').onclick = () => { clearStaticCard(); openAsk({ guest: g.id, name: g.name, people: 1 }); };
        return;
      }
      if (!r.ok) { notice('no', t.notFoundH, g ? g.name : '', '', `<button class="btn secondary" type="button" data-x>${t.closeNote}</button>`); return; }
      welcome({ id: g.id, name: r.name, n: r.people, left: r.left, status: r.status, at: Date.now(), undo: true }, keep);
      return;
    }
    if (!r.ok) { notice('no', t.notFoundH, g ? g.name : '', t.notFoundOld, `<button class="btn secondary" type="button" data-x>${t.closeNote}</button>`); return; }
    if (r.already) { notice('wait', t.alreadyOld, r.name, P(r.seats), `<button class="btn secondary" type="button" data-x>${t.closeNote}</button>`); return; }
    welcome({ id: g.id, name: r.name, n: r.seats, left: 0, status: r.status, at: Date.now(), undo: false }, false);
  }

  // ---------- the green band after a check-in: stays until the next one (or 2 minutes), with Undo ----------
  function showBand(info) {
    if (band) band.close();
    bandInfo = info;
    band = App.undoBand({ text: '', undoLabel: t.undo, onUndo: () => undoCheckIn(info), ms: BAND_MS, tone: 'ok', mount: $('#undoSlot') });
    const b = band; setTimeout(() => { if (band === b && !b.el.isConnected) { band = null; bandInfo = null; } }, BAND_MS + 50);
    drawBand();
  }
  function drawBand() {
    if (!band || !bandInfo || !band.el.isConnected) return;
    const i = bandInfo, el = band.el, canUndo = i.undo && v2 && undoOk !== false;
    const note = i.status === 'no' ? t.hadDeclined : i.status === 'pending' ? t.noReplySub : '';
    const sub = [i.left ? t.bandLeft(i.left) : '', note].filter(Boolean).map(esc).concat(tmHtml(i.at)).join(' · ');
    el.querySelector('.ub-t').innerHTML = `<b>${t.band(`<bdi>${esc(i.name)}</bdi>`, i.n)}</b><span class="ub-s">${sub}</span>${canUndo ? '' : `<span class="ub-s ub-hint">${esc(t.undoNo)}</span>`}`;
    const u = el.querySelector('.ub-undo'); u.textContent = t.undo; u.hidden = !canUndo;
  }
  // a short band with no Undo (the result of an undo)
  function infoBand(tone, html, ms) {
    if (band) band.close(); bandInfo = null;
    band = App.undoBand({ text: '', ms, tone, mount: $('#undoSlot') });
    band.el.querySelector('.ub-t').innerHTML = html; band.el.querySelector('.ub-undo').hidden = true;
  }
  async function undoCheckIn(info) {
    if (band) band.close();            // Undo from a "Just arrived" row: the band of a later check-in goes too
    band = null; bandInfo = null;
    infoBand('wait', `<b>${esc(t.undoing)}</b>`, 0);
    let r; try { r = await sb.rpc('undo_check_in_v2', { p_guest: info.id, p_people: info.n }); } catch (e) { r = { error: { message: String(e) } }; }
    if (r.error && App.missingFn(r.error)) { undoOk = false; showBand({ ...info }); return; }
    // this check-in can't be undone from the door any more: take Undo off its "Just arrived" row too
    const noMore = () => { recent.forEach(x => { if (x.id === info.id && x.at === info.at) x.u = false; }); if (ev) ss.set('door-recent-' + ev.id, recent); if (!$('#q').value.trim()) renderList(); };
    if (r.error && r.error.code) {
      // the server said no (e.g. this phone's door access has ended): retrying won't help
      noMore();
      infoBand('no', `<b>${t.band(`<bdi>${esc(info.name)}</bdi>`, info.n)}</b><span class="ub-s">${esc(t.undoFail)}</span>`, 15000);
      return;
    }
    if (r.error) { toast(t.err); showBand(info); return; }
    const d = r.data || {};
    if (!d.ok) {
      const why = d.reason === 'too_late' ? t.undoLate : d.reason === 'not_yours' ? t.undoNotYours : t.undoNothing;
      noMore();
      infoBand('no', `<b>${t.band(`<bdi>${esc(info.name)}</bdi>`, info.n)}</b><span class="ub-s">${esc(why)}</span>`, 15000);
      return;
    }
    App.vibrate([20, 40, 20]);
    const g = list.find(x => x.id === info.id);
    if (g) { g.checked_in_count = d.arrived; if (!d.arrived) g.checked_in_at = null; }
    recent = recent.filter(x => !(x.id === info.id && x.at === info.at)); if (ev) ss.set('door-recent-' + ev.id, recent);
    infoBand('wait', `<b>${t.undone(`<bdi>${esc(info.name)}</bdi>`)}</b>`, 8000);
    // back to the search that found them, so the right guest is one tap away
    if (info.q != null && !$('#q').value) $('#q').value = info.q;
    renderList(); loadList();
  }

  // ---------- door passes (supabase/migrations/0005): scan the QR on the guest's phone ----------
  // The QR holds <site>/door.html#p=<key>. A hit opens that guest's card, the same card a search shows
  // (already in, over the limit, Ask the hosts all work as usual). The key is never shown or kept in the page.
  async function lookupPass(evId, key) {
    let r; try { r = await sb.rpc('door_pass_lookup_v2', { p_event: evId, p_key: key }); } catch (e) { r = { error: { message: String(e) } }; }
    if (r.error && App.missingFn(r.error)) { passOk = false; drawScanBtn(); }
    return r;
  }
  function openPassGuest(row, tapped) {
    const g = { ...row, checked_in_count: row.checked_in_count ?? (row.checked_in_at ? row.seats : 0) };
    const i = list.findIndex(x => x.id === g.id);
    if (i >= 0) list[i] = { ...list[i], ...g }; else list.push(g);       // added since the last refresh
    clearStaticCard();
    $('#q').value = g.pass_code ? App.passCode(g.pass_code) : g.name;    // the code finds exactly this guest
    renderList(); if (tapped) App.vibrate(25);          // no buzz on a page that just opened (browsers block it)
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  function scanMsg(s, tone) {
    clearTimeout(scanMsgT);
    const m = $('#scanMsg'); m.textContent = s || ''; m.className = 'scan-msg' + (tone ? ' tone-' + tone : '');
    // a "not this event" message goes back to the hint after a while; the camera keeps looking meanwhile
    if (tone === 'no' && scanStream) scanMsgT = setTimeout(() => { if (scanStream) scanMsg(t.scanHint); }, 5000);
  }
  function stopCam() {
    clearTimeout(scanTimer); clearTimeout(scanMsgT);
    if (scanStream) scanStream.getTracks().forEach(x => x.stop());
    scanStream = null; const v = $('#scanV'); if (v) v.srcObject = null;
  }
  // no camera, or it was refused: say so, and offer the search
  function scanFail(msg) { stopCam(); $('#scan').classList.add('nocam'); scanMsg(msg, 'no'); $('#scanSearch').classList.replace('secondary', 'primary'); $('#scanSearch').focus(); }
  function closeScan() { const d = $('#scan'); if (d.open) d.close(); }
  async function openScan() {
    if (!ev || passOk !== true) return;
    const d = $('#scan');
    d.classList.remove('nocam'); $('#scanSearch').classList.replace('primary', 'secondary'); scanMsg(t.scanHint);
    scanLast = { s: '', at: 0, final: false }; scanBusy = false;
    if (!d.open) d.showModal();
    const my = ++scanGen;      // a close (or a newer open) while the camera permission is still being asked makes this one stale
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { scanFail(t.noCamera); return; }
    let s;
    try { s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }); }
    catch (e) { if (my === scanGen && d.open) scanFail(/NotAllowed|Security|Permission/i.test((e && e.name) || '') ? t.camDenied : t.noCamera); return; }
    if (!d.open || my !== scanGen) { s.getTracks().forEach(x => x.stop()); return; }
    scanStream = s; const v = $('#scanV'); v.srcObject = s; try { await v.play(); } catch (e) {}
    // the phone's own QR reader where there is one (Android Chrome); else the vendored jsQR (iPhone)
    if (!scanDet && 'BarcodeDetector' in window) {
      try { const f = window.BarcodeDetector.getSupportedFormats ? await window.BarcodeDetector.getSupportedFormats() : ['qr_code']; if (f.includes('qr_code')) scanDet = new window.BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {}
    }
    if (!scanDet && !window.jsQR) { try { await App.loadScript('vendor/jsqr/jsQR.js'); } catch (e) { if (my === scanGen) scanFail(t.err); return; } }
    if (my === scanGen && scanStream === s) nextFrame();
  }
  const SCAN_AGAIN = 2500;
  function nextFrame() { clearTimeout(scanTimer); scanTimer = setTimeout(readFrame, 150); }
  async function readFrame() {
    const v = $('#scanV');
    if (!$('#scan').open || !scanStream) return;
    if (scanBusy || v.readyState < 2 || !v.videoWidth) { nextFrame(); return; }
    let text = null;
    try {
      if (scanDet) { const c = await scanDet.detect(v); text = c && c[0] && c[0].rawValue; }
      else {
        const w = Math.min(720, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
        scanCanvas = scanCanvas || document.createElement('canvas'); scanCanvas.width = w; scanCanvas.height = h;
        const cx = scanCanvas.getContext('2d', { willReadFrequently: true }); cx.drawImage(v, 0, 0, w, h);
        const r = window.jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
        text = r && r.data;
      }
    } catch (e) {}
    if (text) await onScan(text);
    if (scanStream) nextFrame();
  }
  async function onScan(text) {
    // The same code still in front of the camera: a final answer (not a pass, another event's pass) stays
    // as it is while the code stays in view, and is only asked again once it has been away for 2.5 s;
    // after an error (no signal) it is tried again 2.5 s later, not on every frame.
    if (text === scanLast.s && Date.now() - scanLast.at < SCAN_AGAIN) { if (scanLast.final) scanLast.at = Date.now(); return; }
    scanLast = { s: text, at: Date.now(), final: true };
    const key = App.passKeyOf(text);
    if (!key) { scanMsg(t.notPass, 'no'); App.vibrate([20, 40, 20]); return; }
    scanBusy = true; scanMsg(t.scanChecking);
    const r = await lookupPass(ev.id, key);
    scanBusy = false;
    if (!$('#scan').open) return;
    if (r.error && App.missingFn(r.error)) { closeScan(); toast(t.passNoDb); return; }
    if (r.error && r.error.code && /not allowed/i.test(r.error.message || '')) {     // door access ended mid-shift: retrying won't help
      closeScan(); notice('no', t.scanRefused, '', t.scanRefusedSub, `<button class="btn secondary" type="button" data-x>${t.closeNote}</button>`); App.vibrate([20, 40, 20]); return;
    }
    if (r.error) { scanLast = { s: text, at: Date.now(), final: false }; scanMsg(t.err, 'no'); return; }
    if (!r.data) { scanMsg(t.passWrong, 'no'); App.vibrate([20, 40, 20]); return; }
    closeScan(); openPassGuest(r.data, true);
  }
  $('#scanBtn').onclick = openScan;
  $('#scanX').onclick = closeScan;
  $('#scanSearch').onclick = () => { closeScan(); $('#q').focus(); };
  $('#scan').addEventListener('close', () => { scanGen++; stopCam(); scanBusy = false; });

  // door.html#p=<key>: a pass scanned with the phone's own camera. Kept for 15 minutes (through a login)
  // and used once the event is loaded; if it belongs to another of this phone's events, that event opens.
  function takeHashKey() {
    const m = location.hash.match(/[#&]p=([A-Za-z0-9_-]{22,64})/);
    if (!m) return false;
    try { localStorage.setItem('door-pass', JSON.stringify({ k: m[1], at: Date.now() })); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    return true;
  }
  function pendingKey() {
    try { const p = JSON.parse(localStorage.getItem('door-pass') || 'null'); localStorage.removeItem('door-pass'); if (p && Date.now() - p.at < 15 * 60e3) return p.k; } catch (e) {}
    return null;
  }
  async function usePending() {
    if (!ev) return;
    const key = pendingKey(); if (!key) return;
    if (passOk === null) await probePass();
    const close = `<button class="btn secondary" type="button" data-x>${t.closeNote}</button>`;
    if (passOk !== true) { notice('no', t.passNoDb, '', '', close); return; }
    let r = await lookupPass(ev.id, key);
    if (r.error) { toast(t.err); return; }
    if (!r.data) for (const e of events) {
      if (e.id === ev.id) continue;
      const x = await lookupPass(e.id, key);
      if (!x.error && x.data) { await pick(e); r = x; break; }
    }
    if (!r.data) { notice('no', t.passWrong, '', t.passWrongSub, close); return; }
    openPassGuest(r.data);
  }
  window.addEventListener('hashchange', () => { if (takeHashKey() && ev) usePending(); });

  // ---------- asking the host (unlisted guests, extra people) ----------
  $('#unlisted').onclick = () => openAsk({ guest: null, name: $('#q').value.trim(), people: 1 });
  function openAsk(p) {
    exPrefill = { reason: null, note: '', ...p, people: Math.max(1, Math.min(MAX_ASK, p.people || 1)) };
    renderForm();
    App.openSheet($('#ask'));
    if (!exPrefill.guest && !exPrefill.name && $('#xName')) $('#xName').focus();
  }
  $('#ask').addEventListener('close', () => { exPrefill = null; $('#askBody').innerHTML = ''; });
  function keepForm() { if (!exPrefill) return; if ($('#xName')) exPrefill.name = $('#xName').value; if ($('#xNote')) exPrefill.note = $('#xNote').value; }
  function renderForm() {
    const d = $('#ask');
    if (!exPrefill) { if (d.open) d.close(); $('#askBody').innerHTML = ''; return; }
    const p = exPrefill, g = p.guest ? list.find(x => x.id === p.guest) : null;
    $('#askBody').innerHTML = `
      ${p.guest ? `<div class="ask-who"><b class="t-name"><bdi>${esc(p.name)}</bdi></b>${g ? `<span class="t-small">${esc(t.allowedLine(allowed(g), g.checked_in_count || 0))}</span>` : ''}</div>`
        : `<label class="f" for="xName">${t.name}</label><input type="text" id="xName" dir="auto" maxlength="120" autocomplete="off" value="${esc(p.name)}">`}
      <p class="f-cap" id="xNL">${t.count}</p>
      <div class="pchips" role="group" aria-labelledby="xNL">${[1, 2, 3, 4, 5, 6].map(n => `<button type="button" class="num" data-n="${n}" aria-pressed="${n === p.people}">${n}</button>`).join('')}<button type="button" class="num big" data-big aria-pressed="${p.people > 6}" aria-label="${esc(t.bigN)}"><span dir="ltr">7+</span></button></div>
      <div class="pbig" id="xBig" ${p.people > 6 ? '' : 'hidden'}><div class="stepper" dir="ltr" role="group" aria-label="${esc(t.count)}"><button type="button" data-bd aria-label="${esc(t.less)}">−</button><output class="num" id="xBigN" aria-live="polite">${Math.max(7, p.people)}</output><button type="button" data-bi aria-label="${esc(t.more)}">+</button></div></div>
      <p class="f-cap" id="xRL">${t.reasonL}</p>
      <div class="fchips rchips" role="group" aria-labelledby="xRL">${t.reasons.map((r, i) => `<button type="button" class="fchip" data-r="${i}" aria-pressed="${p.reason === i}">${r}</button>`).join('')}</div>
      <label class="f" for="xNote">${t.otherNote}</label><input type="text" id="xNote" dir="auto" maxlength="400" autocomplete="off" value="${esc(p.note)}">
      <button class="btn primary big block xsend" type="button" id="xSend"><i class="i i-bell"></i><span>${esc(t.send(p.people))}</span></button>`;
    const setPeople = n => {
      p.people = Math.max(1, Math.min(MAX_ASK, n));
      $('#askBody').querySelectorAll('[data-n]').forEach(x => x.setAttribute('aria-pressed', +x.dataset.n === p.people));
      $('[data-big]').setAttribute('aria-pressed', p.people > 6);
      $('#xBig').hidden = p.people <= 6;
      if (p.people > 6) { $('#xBigN').textContent = p.people; $('[data-bd]').disabled = p.people <= 7; $('[data-bi]').disabled = p.people >= MAX_ASK; }
      $('#xSend span').textContent = t.send(p.people);
    };
    setPeople(p.people);
    $('#askBody').querySelectorAll('[data-n]').forEach(b => b.onclick = () => setPeople(+b.dataset.n));
    $('[data-big]').onclick = () => { if (p.people <= 6) { setPeople(7); App.vibrate(8); } };
    $('[data-bd]').onclick = () => { setPeople(p.people - 1 < 7 ? 7 : p.people - 1); App.vibrate(8); };
    $('[data-bi]').onclick = () => { setPeople(p.people + 1); App.vibrate(8); };
    $('#askBody').querySelectorAll('[data-r]').forEach(b => b.onclick = () => { p.reason = p.reason === +b.dataset.r ? null : +b.dataset.r; $('#askBody').querySelectorAll('[data-r]').forEach(x => x.setAttribute('aria-pressed', p.reason === +x.dataset.r)); });
    $('#xSend').onclick = async () => {
      keepForm();
      const name = String(p.name || '').trim(), n = Math.min(MAX_ASK, Math.max(1, p.people || 1));
      if (!name) { toast(t.needName); if ($('#xName')) $('#xName').focus(); return; }
      if (busy) return; busy = true; $('#xSend').setAttribute('aria-busy', 'true');
      const note = [p.reason != null ? t.reasons[p.reason] : '', String(p.note || '').trim()].filter(Boolean).join(' · ') || null;
      let r; try { r = await sb.rpc('request_exception_v2', { p_event: ev.id, p_guest: p.guest, p_name: name, p_people: n, p_note: note }); } catch (e) { r = { error: { message: String(e) } }; }
      busy = false; if ($('#xSend')) $('#xSend').removeAttribute('aria-busy');
      if (r.error) { toast(t.err); return; }
      // the stepper goes back to the number still allowed; nothing left to ask about
      if (p.guest) { delete typed[p.guest]; delete extraAsk[p.guest]; }
      exPrefill = null; renderForm(); toast(t.sent); clearStaticCard();
      $('#q').value = ''; renderList();
      await loadReqs(); schedule();
    };
  }

  // ---------- requests and the host's answers ----------
  async function loadReqs() {
    if (!v2 || !ev) { reqs = []; drawReqs(); return; }
    const id = ev.id; let r;
    try { r = await sb.rpc('list_exceptions_v2', { p_event: id }); } catch (e) { return; }
    if (r.error || !ev || ev.id !== id) return;
    reqs = r.data || [];
    let decided = false;
    for (const x of reqs) {
      if (reqsLoaded && seenReq.get(x.id) === 'pending' && x.status !== 'pending') { answers.unshift({ id: x.id, status: x.status, name: x.name, people: x.people }); decided = true; }
      seenReq.set(x.id, x.status);
    }
    reqsLoaded = true;
    if (decided) { App.vibrate([30, 60, 30]); drawAnswers(); loadList(); }
    drawReqs(); drawMeter();
  }
  // The host's answers sit just under the search; the newest two show, the rest fold up. While a name is
  // typed only the newest one stays (compact), so an answer is never hidden at the moment the door is busy.
  // Screen readers hear each answer once, through #annLive, not again on every redraw.
  function drawAnswers() {
    const fresh = answers.filter(a => !announced.has(a.id));
    fresh.forEach(a => announced.add(a.id));
    if (fresh.length) $('#annLive').textContent = fresh.map(a => (a.status === 'approved' ? t.okBanner(a.name, P(a.people)) + '. ' + t.okBannerSub : t.noBanner(a.name) + '. ' + t.noBannerSub)).join(' ');
    const shown = showAllAns ? answers : answers.slice(0, ANS_SHOWN), rest = answers.length - shown.length;
    $('#answers').innerHTML = shown.map(a => `<div class="answer panel tone-${a.status === 'approved' ? 'ok' : 'no'}"><i class="i ${a.status === 'approved' ? 'i-check' : 'i-x'} t-tone"></i><div class="an-m"><b>${a.status === 'approved' ? t.okBanner(`<bdi class="nb">${esc(a.name)}</bdi>`, esc(P(a.people))) : t.noBanner(`<bdi class="nb">${esc(a.name)}</bdi>`)}</b><span>${a.status === 'approved' ? t.okBannerSub : t.noBannerSub}</span></div><button class="an-x" type="button" data-dismiss="${esc(a.id)}" aria-label="${t.dismiss}"><i class="i i-x"></i></button></div>`).join('')
      + (rest > 0 ? `<button class="btn quiet an-more" type="button" id="ansMore"><i class="i i-chev sm"></i><span>${esc(t.moreAns(rest))}</span></button>` : '');
    $('#answers').querySelectorAll('[data-dismiss]').forEach(b => b.onclick = () => { answers = answers.filter(a => a.id !== b.dataset.dismiss); if (answers.length <= ANS_SHOWN) showAllAns = false; drawAnswers(); });
    if ($('#ansMore')) $('#ansMore').onclick = () => { showAllAns = true; drawAnswers(); };
  }
  function drawReqs() {
    const box = $('#myReqs');
    if (!v2 || !reqs.length) { box.innerHTML = ''; return; }
    const wasOpen = !!(box.querySelector('details') && box.querySelector('details').open);
    const lbl = { pending: t.pending, approved: t.approved, rejected: t.rejected }, tone = { pending: 'wait', approved: 'ok', rejected: 'no' };
    const mins = iso => Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
    const row = r => `<div class="row rq">${mono(r.name, tone[r.status])}<div class="row-main"><b class="t-name"><bdi>${esc(r.name)}</bdi></b><span class="rq-s"><span>${esc(P(r.people))}</span>${r.note ? `<bdi>${esc(r.note)}</bdi>` : ''}${r.created_at ? `<span class="num">${esc(t.ago(mins(r.created_at)))}</span>` : ''}</span></div><span class="row-end"><span class="tag tone-${tone[r.status]}">${lbl[r.status]}${r.status === 'pending' ? '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>' : ''}</span></span></div>`;
    const pend = reqs.filter(r => r.status === 'pending'), done = reqs.filter(r => r.status !== 'pending');
    box.innerHTML = `<h2 class="eyebrow d-cap">${t.reqs}</h2>`
      + (pend.length ? `<div class="rowlist rlist">${pend.slice(0, 30).map(row).join('')}</div>` : '')
      + (done.length ? `<details class="rdone"${wasOpen || !pend.length ? ' open' : ''}><summary>${t.answered(done.length)}<i class="i i-chev sm"></i></summary><div class="rowlist rlist">${done.slice(0, 30).map(row).join('')}</div></details>` : '');
  }
});
</script>
</body>
</html>
