<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>شاشة الباب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
</head>
<body>
<div class="topbar"><a class="brand" id="brand" href="host.html"></a><button class="link" id="out" hidden>خروج</button></div>
<main>
  <div id="auth"></div>
  <section id="door" hidden>
    <div class="evlist" id="evlist"></div>
    <h2 id="title" style="margin-top:14px"></h2>
    <p class="sub" id="count"></p>
    <div id="reader"></div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="cam">تشغيل الكاميرا</button></div>
    <div id="result" aria-live="assertive"></div>

    <h3>البحث بالاسم</h3>
    <input type="search" id="q" placeholder="اكتبي اسم الضيف" aria-label="بحث بالاسم">
    <div class="glist" id="list" style="margin-top:10px"></div>
  </section>
</main>
<script>
(function () {
  const { sb, $, esc, toast } = App;
  $('#brand').textContent = CONFIG.BRAND;
  let events = [], ev = null, list = [], scanner = null, busy = false;

  App.requireLogin($('#auth'), async () => {
    $('#out').hidden = false; $('#out').onclick = App.signOut;
    const { data } = await sb.from('events').select('id, title, starts_at').order('starts_at');
    events = data || [];
    if (!events.length) { $('#auth').innerHTML = '<div class="login box"><h2>ما في مناسبات</h2><p class="sub">هالإيميل غير مربوط بأي مناسبة.</p></div>'; return; }
    pick(events[0]);
  });

  async function pick(e) {
    ev = e; $('#door').hidden = false; $('#title').textContent = ev.title; $('#result').innerHTML = '';
    $('#evlist').innerHTML = events.length > 1 ? events.map(x => `<button data-id="${x.id}" aria-current="${x.id === ev.id}">${esc(x.title)}</button>`).join('') : '';
    $('#evlist').querySelectorAll('button').forEach(b => b.onclick = () => pick(events.find(x => x.id === b.dataset.id)));
    await loadList();
  }

  async function loadList() {
    const { data, error } = await sb.rpc('door_list', { p_event: ev.id });
    if (error) { toast('ما قدرنا نجيب القائمة'); return; }
    list = data || []; renderList();
  }

  function renderList() {
    const arrived = list.filter(g => g.checked_in_at).reduce((a, g) => a + g.seats, 0);
    const expected = list.filter(g => g.status === 'yes').reduce((a, g) => a + g.seats, 0);
    $('#count').textContent = `وصل ${arrived} من ${expected} مؤكدين`;
    const q = $('#q').value.trim();
    const rows = q ? list.filter(g => g.name.includes(q)).slice(0, 30) : [];
    $('#list').innerHTML = !q ? '<p class="empty">اكتبي الاسم إذا الضيف ما معاه الرمز.</p>' : rows.length ? rows.map(g => `<div class="gi"><div class="gi-main"><div class="gi-top"><b>${esc(g.name)}</b>
      <span class="pill ${g.status}">${{ yes: 'مؤكد', no: 'معتذر', pending: 'ما رد' }[g.status]}</span></div><div class="gi-sub"><span>${g.seats} ${g.seats > 1 ? 'دعوات' : 'دعوة'}</span></div></div>
      <div class="gi-act">${g.checked_in_at ? '<span class="pill yes">وصل</span>' : `<button class="icon" data-in="${g.id}">تسجيل الوصول</button>`}</div></div>`).join('')
      : '<p class="empty">الاسم مو موجود بالقائمة. تواصلي مع صاحب الدعوة.</p>';
    $('#list').querySelectorAll('[data-in]').forEach(b => b.onclick = async () => {
      const { data, error } = await sb.rpc('check_in_guest', { p_guest: b.dataset.in });
      if (error) { toast('ما قدرنا نسجل الوصول'); return; }
      show(data); loadList();
    });
  }
  $('#q').oninput = renderList;

  function show(r) {
    const el = $('#result');
    if (!r.ok) { el.innerHTML = '<div class="result bad reveal"><b>غير موجود بالقائمة</b>تواصلي مع صاحب الدعوة، هو اللي يقرر.</div>'; return; }
    const seats = `${r.seats} ${r.seats > 1 ? 'أشخاص' : 'شخص'}`;
    if (r.already) { el.innerHTML = `<div class="result warn reveal"><b>${esc(r.name)}</b>هالرمز انمسح قبل. ${seats}</div>`; return; }
    const note = r.status === 'yes' ? '' : r.status === 'no' ? ' · كان معتذر' : ' · ما أكد الحضور';
    el.innerHTML = `<div class="result good reveal"><b>✓ ${esc(r.name)}</b>${seats}${note}</div>`;
  }

  async function onScan(text) {
    if (busy) return; busy = true;
    let token = text.trim();
    try { const u = new URL(token); token = u.searchParams.get('t') || token; } catch (e) {}
    const { data, error } = await sb.rpc('check_in', { p_token: token, p_event: ev.id });
    if (error) toast('ما قدرنا نتحقق، جربي مرة ثانية'); else { show(data); loadList(); }
    setTimeout(() => { busy = false; }, 2500);
  }

  $('#cam').onclick = async () => {
    if (scanner) { await scanner.stop().catch(() => {}); scanner = null; $('#cam').textContent = 'تشغيل الكاميرا'; return; }
    if (!window.Html5Qrcode) { toast('ما قدرنا نشغل الماسح'); return; }
    scanner = new Html5Qrcode('reader');
    try {
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } }, onScan);
      $('#cam').textContent = 'إيقاف الكاميرا';
    } catch (e) { scanner = null; toast('اسمحي للموقع يستخدم الكاميرا من إعدادات المتصفح'); }
  };
})();
</script>
</body>
</html>
