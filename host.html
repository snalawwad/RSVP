<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة صاحب الدعوة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
</head>
<body>
<div class="topbar"><a class="brand" id="brand" href="host.html"></a><a href="door.html">شاشة الباب</a><a href="admin.html" id="adminLink" hidden>لوحة التحكم</a><button class="link" id="out" hidden>خروج</button></div>
<main>
  <div id="auth"></div>
  <section id="dash" hidden>
    <div class="evlist" id="evlist"></div>
    <h2 id="title" style="margin-top:14px"></h2>
    <p class="sub" id="meta"></p>
    <div class="row" style="margin-bottom:12px">
      <div class="evlist" id="views" style="margin:0"><button data-v="rsvp" aria-current="true">تأكيد الحضور</button><button data-v="att" aria-current="false">الحضور</button></div>
      <div id="sideWrap" style="margin-inline-start:auto"></div>
    </div>
    <p class="sub" id="balance" style="margin:-4px 0 12px;font-size:14px" hidden></p>
    <div class="stats" id="stats" role="group" aria-label="تصفية حسب الحالة"></div>
    <div class="bar-rsvp" id="bar" aria-hidden="true"></div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="ابحث بالاسم أو الرقم" aria-label="بحث">
      <button class="btn small" id="toggleAdd" aria-expanded="false">+ إضافة ضيف</button>
    </div>
    <div class="box" id="addBox" hidden style="margin-top:10px">
      <div class="grid2">
        <div><label class="f" for="nName">الاسم</label><input type="text" id="nName"></div>
        <div><label class="f" for="nPhone">رقم الواتساب</label><input type="tel" id="nPhone" placeholder="9XXXXXXX" inputmode="tel"></div>
        <div><label class="f" for="nSeats">عدد الدعوات</label><input type="number" id="nSeats" min="1" value="1"></div>
        <div id="nSideWrap"><label class="f" for="nSide">القائمة</label><input type="text" id="nSide" list="sidesList" placeholder="مثال: ام العروس"><datalist id="sidesList"></datalist></div>
        <div style="display:flex;align-items:flex-end"><button class="btn" id="addGuest" style="width:100%">إضافة وإرسال</button></div>
      </div>
    </div>
    <p class="sub" id="listHead" style="margin:22px 0 6px;font-size:14px"></p>
    <div class="glist" id="rows"></div>
  </section>
</main>
<script>
(function () {
  const { sb, $, esc, toast, normPhone, showPhone, fmtDate, fmtTime, waLink, fillTemplate, DEFAULT_TEMPLATE } = App;
  $('#brand').textContent = CONFIG.BRAND;
  let events = [], ev = null, guests = [], members = [], mySide = null, side = 'all', view = 'rsvp', filter = 'all', attFilter = 'all', query = '', channel = null, poll = null, admin = false, myEmail = '';

  App.requireLogin($('#auth'), async (session) => {
    myEmail = (session.user.email || '').toLowerCase();
    $('#out').hidden = false; $('#out').onclick = App.signOut;
    admin = !!(await sb.rpc('is_admin')).data;
    $('#adminLink').hidden = !admin;
    const { data: evs, error } = await sb.from('events').select('*').order('starts_at', { ascending: true });
    if (error) { toast('ما قدرنا نجيب المناسبات'); return; }
    const { data: mem } = await sb.from('event_members').select('*');
    members = mem || [];
    const mine = members.filter(m => m.email.toLowerCase() === myEmail);
    const doorOnly = new Set(mine.filter(m => m.role === 'door').map(m => m.event_id));
    events = (evs || []).filter(e => admin || !doorOnly.has(e.id));
    if (!events.length) {
      $('#auth').innerHTML = doorOnly.size ? '<div class="login box"><h2>شاشة الباب</h2><p class="sub">حسابج مخصص لتسجيل الحضور عند الباب.</p><a class="btn" href="door.html">فتح شاشة الباب</a></div>'
        : '<div class="login box"><h2>ما في مناسبات</h2><p class="sub">ما لقينا مناسبة مربوطة بهالإيميل. تواصلي معنا على الواتساب لربطها.</p></div>';
      return;
    }
    const saved = new URLSearchParams(location.search).get('event');
    pick(events.find(e => e.id === saved) || events[0]);
  });

  async function pick(e) {
    ev = e; $('#dash').hidden = false; side = 'all'; filter = 'all';
    const m = members.find(x => x.event_id === ev.id && x.email.toLowerCase() === myEmail && x.role === 'host');
    mySide = !admin && m && m.side ? m.side : null;
    $('#evlist').innerHTML = events.length > 1 ? events.map(x => `<button data-id="${x.id}" aria-current="${x.id === ev.id}">${esc(x.title)}</button>`).join('') : '';
    $('#evlist').querySelectorAll('button').forEach(b => b.onclick = () => pick(events.find(x => x.id === b.dataset.id)));
    $('#title').textContent = ev.title;
    $('#meta').textContent = [fmtDate(ev.starts_at), fmtTime(ev.starts_at), ev.venue].filter(Boolean).join('، ');
    await loadGuests();
    if (channel) sb.removeChannel(channel);
    channel = sb.channel('guests-' + ev.id).on('postgres_changes', { event: '*', schema: 'public', table: 'guests', filter: `event_id=eq.${ev.id}` }, loadGuests).subscribe();
    clearInterval(poll); poll = setInterval(loadGuests, 30000);
  }

  async function loadGuests() {
    const { data, error } = await sb.from('guests').select('*').eq('event_id', ev.id).order('created_at');
    if (error) { toast('ما قدرنا نجيب القائمة'); return; }
    guests = data || []; render();
  }

  const sidesOf = () => [...new Set([...guests.map(g => g.side), ...members.filter(m => m.event_id === ev.id).map(m => m.side)].filter(Boolean))];

  function renderSide() {
    const sides = sidesOf();
    $('#sidesList').innerHTML = sides.map(s => `<option value="${esc(s)}">`).join('');
    if (mySide) { $('#sideWrap').innerHTML = `<span class="pill pending" style="font-size:14px">قائمة ${esc(mySide)}</span>`; $('#nSideWrap').hidden = true; return; }
    $('#nSideWrap').hidden = false;
    if (!sides.length) { $('#sideWrap').innerHTML = ''; return; }
    if (side !== 'all' && !sides.includes(side)) side = 'all';
    $('#sideWrap').innerHTML = `<label class="f" for="sideSel" style="display:inline;margin-inline-end:6px">القائمة</label><select id="sideSel" style="width:auto;min-height:36px;padding:4px 10px">
      <option value="all">كل القوائم</option>${sides.map(s => `<option value="${esc(s)}" ${s === side ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>`;
    $('#sideSel').onchange = e => { side = e.target.value; if (side !== 'all') $('#nSide').value = side; render(); };
  }

  function render() {
    renderSide();
    document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-current', b.dataset.v === view));
    const pool = guests.filter(g => side === 'all' || g.side === side);
    const seats = list => list.reduce((a, g) => a + (g.seats || 1), 0);
    // package balance (whole event)
    const used = seats(guests);
    if (ev.invite_limit != null) {
      const left = ev.invite_limit - used;
      $('#balance').hidden = false;
      $('#balance').innerHTML = `الباقة: ${ev.invite_limit} دعوة · المستخدم ${used} · <b style="color:${left > 0 ? 'var(--ok)' : 'var(--no)'}">المتبقي ${Math.max(0, left)}</b>`;
      $('#addGuest').disabled = left <= 0;
    } else { $('#balance').hidden = true; $('#addGuest').disabled = false; }

    const q = query.trim(), qd = q.replace(/\D/g, '');
    const match = g => !q || g.name.includes(q) || (qd && g.phone.includes(qd));
    if (view === 'rsvp') renderRsvp(pool, seats, match); else renderAtt(pool, seats, match);
  }

  function renderRsvp(pool, seats, match) {
    const of = st => pool.filter(g => st === 'all' || g.status === st);
    const K = [['all', 'المدعوين'], ['yes', 'أكدوا الحضور'], ['pending', 'بانتظار الرد'], ['no', 'اعتذروا']];
    $('#stats').innerHTML = K.map(([k, l]) => `<button class="stat s-${k}" data-f="${k}" aria-pressed="${filter === k}"><b>${seats(of(k))}</b><span>${l}</span><small>${of(k).length} ضيف · ${seats(of(k))} دعوة</small></button>`).join('');
    $('#stats').querySelectorAll('button').forEach(b => b.onclick = () => { filter = filter === b.dataset.f && b.dataset.f !== 'all' ? 'all' : b.dataset.f; render(); });
    const tot = seats(pool) || 1;
    $('#bar').innerHTML = `<i class="y" style="width:${seats(of('yes')) / tot * 100}%"></i><i class="w" style="width:${seats(of('pending')) / tot * 100}%"></i><i class="n" style="width:${seats(of('no')) / tot * 100}%"></i>`;
    const order = { pending: 0, yes: 1, no: 2 };
    const list = of(filter).filter(match).sort((a, b) => filter === 'all' ? order[a.status] - order[b.status] : 0);
    const lbl = { yes: 'حاضر', no: 'معتذر', pending: 'بانتظار الرد' };
    $('#listHead').textContent = `${K.find(k => k[0] === filter)[1]} (${list.length} ضيف · ${seats(list)} دعوة)`;
    $('#rows').innerHTML = list.length ? list.map(g => `<div class="gi"><div class="gi-main">
        <div class="gi-top"><b>${esc(g.name)}</b><span class="pill ${g.status}">${lbl[g.status]}</span>${g.checked_in_at ? '<span class="pill yes">وصل</span>' : ''}</div>
        <div class="gi-sub"><span dir="ltr">${esc(showPhone(g.phone))}</span><span>${g.seats} ${g.seats > 1 ? 'دعوات' : 'دعوة'}</span>${g.side && side === 'all' && !mySide ? `<span>${esc(g.side)}</span>` : ''}${g.sent_at ? '' : '<span style="color:var(--wait)">لم تُرسل بعد</span>'}</div>
        ${g.status === 'no' && g.decline_reason ? `<p class="gi-why">«${esc(g.decline_reason)}»</p>` : ''}</div>
        <div class="gi-act"><a class="icon" href="${waLink(g.phone, fillTemplate(App.templateFor(ev), ev, g))}" target="_blank" rel="noopener" data-sent="${g.id}">${g.sent_at ? 'إعادة إرسال' : 'إرسال'}</a><button class="icon" data-del="${g.id}">حذف</button></div></div>`).join('')
      : `<p class="empty">${query.trim() ? 'ما في نتائج لهالبحث.' : 'ما في أحد بهالقائمة حالياً.'}</p>`;
    $('#rows').querySelectorAll('[data-sent]').forEach(a => a.onclick = () => markSent(a.dataset.sent));
    $('#rows').querySelectorAll('[data-del]').forEach(b => b.onclick = () => del(b));
  }

  function renderAtt(pool, seats, match) {
    const came = pool.filter(g => g.checked_in_at), notYet = pool.filter(g => !g.checked_in_at && g.status !== 'no');
    const ppl = l => l.reduce((a, g) => a + (g.checked_in_count || g.seats || 1), 0);
    const K = [['all', 'المتوقعين', notYet.concat(came)], ['in', 'وصلوا', came], ['out', 'ما وصلوا', notYet]];
    $('#stats').innerHTML = K.map(([k, l, arr]) => `<button class="stat s-${k === 'in' ? 'yes' : k === 'out' ? 'pending' : 'all'}" data-f="${k}" aria-pressed="${attFilter === k}"><b>${k === 'in' ? ppl(arr) : seats(arr)}</b><span>${l}</span><small>${arr.length} ضيف</small></button>`).join('') + '<div class="stat" style="cursor:default"></div>';
    $('#stats').querySelectorAll('button').forEach(b => b.onclick = () => { attFilter = attFilter === b.dataset.f && b.dataset.f !== 'all' ? 'all' : b.dataset.f; render(); });
    const exp = seats(notYet.concat(came)) || 1;
    $('#bar').innerHTML = `<i class="y" style="width:${ppl(came) / exp * 100}%"></i>`;
    const base = K.find(k => k[0] === attFilter)[2];
    const numbered = pool.map((g, i) => ({ g, n: 101 + i }));
    const list = numbered.filter(x => base.includes(x.g) && match(x.g));
    $('#listHead').textContent = `${K.find(k => k[0] === attFilter)[1]} (${list.length} ضيف)`;
    $('#rows').innerHTML = list.length ? list.map(({ g, n }) => `<div class="gi"><div class="gi-main"><div class="gi-top"><span style="color:var(--muted);font-variant-numeric:tabular-nums;min-width:2.5em">${n}</span><b>${esc(g.name)}</b>
        ${g.checked_in_at ? `<span class="pill yes">وصل ${esc(fmtTime(g.checked_in_at))}</span>` : `<span class="pill pending">ما وصل</span>`}</div>
        <div class="gi-sub"><span>${g.seats} ${g.seats > 1 ? 'دعوات' : 'دعوة'}</span>${g.checked_in_at && g.checked_in_count && g.checked_in_count !== g.seats ? `<span>دخل ${g.checked_in_count}</span>` : ''}${g.status === 'pending' ? '<span style="color:var(--wait)">ما أكد الحضور</span>' : ''}</div></div></div>`).join('')
      : '<p class="empty">ما في أحد بهالقائمة حالياً.</p>';
  }

  document.querySelectorAll('#views button').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });

  async function markSent(id) { await sb.from('guests').update({ sent_at: new Date().toISOString() }).eq('id', id); }

  async function del(b) {
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'تأكيد الحذف'; b.style.color = 'var(--no)'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'حذف'; b.style.color = ''; } }, 3000); return; }
    const g = guests.find(x => x.id === b.dataset.del);
    const { error } = await sb.from('guests').delete().eq('id', g.id);
    if (error) { toast('ما قدرنا نحذف'); return; }
    toast('تم حذف ' + g.name); loadGuests();
  }

  $('#q').oninput = e => { query = e.target.value; render(); };
  $('#toggleAdd').onclick = () => { const b = $('#addBox'), open = b.hidden; b.hidden = !open; $('#toggleAdd').setAttribute('aria-expanded', open); $('#toggleAdd').textContent = open ? 'إغلاق' : '+ إضافة ضيف'; if (open) { if (side !== 'all' && !$('#nSide').value) $('#nSide').value = side; $('#nName').focus(); } };
  $('#addGuest').onclick = async () => {
    const name = $('#nName').value.trim(), phone = normPhone($('#nPhone').value), seats = Math.max(1, parseInt($('#nSeats').value) || 1);
    const gSide = mySide || $('#nSide').value.trim() || null;
    if (!name) { toast('اكتبي اسم الضيف'); return; }
    if (phone.length < 10) { toast('رقم الواتساب ناقص'); return; }
    if (ev.invite_limit != null && guests.reduce((a, g) => a + g.seats, 0) + seats > ev.invite_limit) { toast('ما في رصيد دعوات كافي بالباقة. تواصلي معنا لزيادتها'); return; }
    const { data, error } = await sb.from('guests').insert({ event_id: ev.id, name, phone, seats, side: gSide, sent_at: new Date().toISOString() }).select().single();
    if (error) { toast(error.code === '23505' ? 'هالرقم موجود بالقائمة' : /limit/.test(error.message || '') ? 'ما في رصيد دعوات كافي بالباقة' : 'ما قدرنا نضيف الضيف'); return; }
    $('#nName').value = ''; $('#nPhone').value = ''; $('#nSeats').value = 1;
    window.open(waLink(data.phone, fillTemplate(App.templateFor(ev), ev, data)), '_blank', 'noopener');
    toast('تمت إضافة ' + name); loadGuests();
  };
})();
</script>
</body>
</html>
