    return { title, tab: 'home', onEvent: true,
      main: `<div class="hv-row1"><h1 class="hv-h2">${t.guestsH}</h1>${coRole ? `<span class="hv-cnt">${cw(guests.length, 'guest')}</span>` : `<button type="button" class="hv-add" id="hvAdd"><i class="i i-plus sm"></i>${t.addShort}</button>`}</div>`
        + (open.length && !coRole ? `<button type="button" class="hv-req row-link" id="hvReq"><span class="hv-reqn">${open.length}</span><span class="hv-reqt">${esc(t.reqBar(open.length))}</span><span class="hv-reqg">${t.reqGo} ${chev()}</span></button>` : '')
        + pkgCard
        + (coRole ? '' : `<div class="hv-lines"><button type="button" class="hv-line" id="hvInv"><span class="l">${t.invRow}</span><span class="v">${esc(firstSent ? t.sentOn(dayMon(firstSent)) : t.notSent)}</span>${chev()}</button></div>`)
        + `<div class="hv-search"><i class="i i-search"></i><input type="search" id="hvQ" dir="auto" placeholder="${esc(t.searchShort)}" aria-label="${esc(t.search)}" value="${esc(query)}" autocomplete="off"></div>`
        + chips + listHtml
        + (coRole ? `<p class="hv-note">${t.cohostNote}</p>` : '')
        + (!coRole && !mySide && v2 ? `<button type="button" class="btn danger hv-del" id="hvDel"><i class="i i-trash sm"></i><span>${t.delBtn}</span></button>` : ''),
      bind: () => {
        if ($('#hvAdd')) $('#hvAdd').onclick = addSheet;
        if ($('#hvReq')) $('#hvReq').onclick = () => show('arrivals', { ev: ev.id });
        if (!coRole) $('#hvPkg').onclick = () => show('package', { ev: ev.id });
        if ($('#hvInv')) $('#hvInv').onclick = () => show('invite', { ev: ev.id });
        $('#hvQ').oninput = e => { query = e.target.value; draw(); };
        $('#hMain').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; query = ''; draw(); });
        $('#hMain').querySelectorAll('[data-g]').forEach(b => b.onclick = () => show('guest', { ev: ev.id, g: b.dataset.g }));
        if ($('#hvDel')) $('#hvDel').onclick = delEvent;
      } };
  };
  async function delEvent() {
    const name = ev.headline || ev.title, gone = ev;
    const yes = await App.ask({ title: t.delH, body: t.delP(name) + (ev.paid_at ? t.delPaid : ''), yes: t.delGo, no: t.delKeep, danger: true });
    if (!yes) return;
    const b = $('#hvDel'); if (b) b.setAttribute('aria-busy', 'true');
    const { error } = await sb.rpc('delete_event_v2', { p_event: gone.id });
    if (b) b.removeAttribute('aria-busy');
    if (error) { toast(t.delErr); return; }
    events = events.filter(x => x.id !== gone.id);
    toast(t.delDone(name)); show('home', {}, 'root');
  }

  // =====================================================================
  // 27 / 27a After the event
  // =====================================================================
  function afterView(title) {
    const s = stats(guests), came = guests.reduce((a, g) => a + (g.checked_in_at ? (g.checked_in_count || g.seats || 1) : 0), 0);
    const door = hasDoor(ev) || guests.some(g => g.checked_in_at);
    const sent = guests.filter(g => g.sent_at || g.status !== 'pending').length, noP = s.no.reduce((a, g) => a + (g.seats || 1), 0);
    const L = (l, v, tone) => `<div class="hv-line"><span class="l">${l}</span><span class="v b${tone ? ' tone-' + tone : ''}">${v}</span></div>`;
    return { title,
      main: `<p class="hv-kick">${esc(shortDate(ev.starts_at))} · ${t.doneK}</p><h1 class="hv-h2 big">${door ? t.aftCame(came) : t.aftYes(s.people)}</h1><p class="hv-sub">${door ? t.aftP(s.people) : t.aftPno}</p>
        <div class="hv-lines flat">${L(t.invSentL, sent)}${L(t.saidYesL, cw(s.people))}${door ? L(t.cameL, cw(came), 'ok') : ''}${L(t.cantL, cw(noP), 'mute')}${L(t.noReplyL, t.invitesW(s.pend.length), 'mute')}</div>`,
      foot: (coRole ? '' : `<a class="btn primary block" ${teamLink(t.thanksWa(ev.headline || ev.title))}><i class="i i-chat"></i>${t.thanksB}</a>`) + `<button type="button" class="btn soft-plum block" id="hvCsv"><i class="i i-upload"></i>${t.downloadB}</button>`,
      bind: () => { $('#hvCsv').onclick = downloadList; } };
  }
  function downloadList() {
    const K = { yes: t.K.yes, no: t.K.no, pending: t.K.pending };
    const rows = [t.csvHead].concat(guests.map(g => [g.name, coRole || !g.phone ? '' : App.showPhone(g.phone), sideOf(g) || '', K[g.status] || g.status, App.peopleComing(g), g.checked_in_at ? (g.checked_in_count || g.seats || 1) : 0, g.decline_reason || '']));
    App.downloadCsv(`${String(ev.title || 'guests').replace(/[^\p{L}\p{N}]+/gu, '-')}-guests.csv`, rows);
  }

  // =====================================================================
  // 17a Guest: the reply (in colour, not a button), extra guests (written, the host can't change it), the group,
  // when the invitation went out (Ask our team to resend). Save changes saves the group. Remove guest at the bottom.
  // =====================================================================
  let gEdit = { id: null, side: null }, armed = false, armTimer = null;
  VIEWS.guest = p => {
    const g = guests.find(x => x.id === p.g);
    if (!g) return { title: t.guestT, main: guestsLoaded ? `<p class="hv-empty">${t.noneHere}</p>` : '' };
    if (gEdit.id !== g.id) gEdit = { id: g.id, side: null };
    const side = sideOf(g), shownSide = gEdit.side != null ? gEdit.side : side;
    const changed = gEdit.side != null && gEdit.side !== (side || '');
    const unsent = isUnsent(g), tone = g.status === 'yes' ? 'ok' : g.status === 'no' ? 'no' : 'wait';
    const word = unsent ? t.sendingDots : g.status === 'yes' ? (g.confirmed_count ? t.ofPeople(g.confirmed_count, g.seats || 1) + ' · ' + t.comingW : t.comingW) : g.status === 'no' ? t.cantShort : t.noReplyYet;
    const who = [g.phone ? `<bdi dir="ltr">${esc(App.prettyPhone(g.phone))}</bdi>` : atDoor(g) ? t.atDoorG : t.viaLink, g.note ? bdi(g.note) : side ? bdi(side) : ''].filter(Boolean).join(' · ');
    const extra = Math.max(0, (g.seats || 1) - 1);
    const canSide = !coRole && !mySide;
    return { title: t.guestT,
      main: `<div class="hv-pt"><h1 class="hv-h1 name">${bdi(g.name)}</h1><p class="hv-sub">${who}</p></div>
        <div class="hv-reply"><span class="hv-rl">${t.replyL}</span><span class="hv-rw tone-${tone}">${esc(word)}</span>${g.responded_at && g.status !== 'pending' ? `<span class="hv-rd">${esc(t.repliedOn(dayMon(g.responded_at)))}</span>` : ''}${g.decline_reason ? `<span class="hv-rq" dir="auto">“${esc(g.decline_reason)}”</span>` : ''}</div>
        <div class="hv-lines flat">
          <div class="hv-line"><span class="l">${t.extraGuests}<small>${t.extraGuestsP}</small></span><span class="v ink">${extra ? extra : t.noneWord}</span></div>
          ${shownSide || canSide ? (canSide ? `<button type="button" class="hv-line" id="hvSide"><span class="l">${t.groupL}</span><span class="v ink">${bdi(shownSide || t.notSet)}</span>${chev()}</button>` : `<div class="hv-line"><span class="l">${t.groupL}</span><span class="v ink">${bdi(shownSide)}</span></div>`) : ''}
          ${g.sent_at ? (coRole ? `<div class="hv-line"><span class="l">${esc(t.inviteSentOn(dayMon(g.sent_at)))}</span></div>` : `<a class="hv-line" ${teamLink(t.resendWa(g.name, ev.headline || ev.title))}><span class="l">${esc(t.inviteSentOn(dayMon(g.sent_at)))}</span><span class="v ink">${t.askResend}</span>${chev()}</a>`)
            : g.phone ? `<div class="hv-line"><span class="l">${t.notSentYet}</span><span class="v">${t.sendingWord}</span></div>` : ''}
        </div>
        ${coRole ? '' : `<button type="button" class="btn danger hv-del" id="hvRm"><i class="i i-trash sm"></i><span>${armed ? t.tapRemove : t.remove}</span></button>`}`,
      foot: coRole ? '' : `<button type="button" class="btn primary block" id="hvSave" ${changed ? '' : 'disabled'}>${t.saveChanges}</button>`,
      bind: () => {
        if ($('#hvSide')) $('#hvSide').onclick = () => groupSheet(shownSide);
        if ($('#hvRm')) $('#hvRm').onclick = () => removeGuest(g);
        if ($('#hvSave')) $('#hvSave').onclick = async () => {
          if (!changed) return;
          const b = $('#hvSave'); b.setAttribute('aria-busy', 'true');
          selfIds.add(g.id);
          const { error } = await sb.from('guests').update({ side: gEdit.side.trim() || null }).eq('id', g.id);
          b.removeAttribute('aria-busy');
          if (error) { toast(t.cantSave(why(error))); return; }
          gEdit = { id: null, side: null }; toast(t.saved); await loadGuests(); back();
        };
      } };
  };
  function groupSheet(curSide) {
    const opts = [...new Set([...GROUPS[lang], ...sidesOf()])];
    sheet(t.changeGroup, `<div class="choices" role="radiogroup" aria-label="${esc(t.changeGroup)}">${opts.map(o => `<div class="choice" role="radio" tabindex="0" data-c="${esc(o)}" aria-checked="${o === curSide}"><span class="ch-main"><span class="ch-t">${bdi(o)}</span></span><span class="radio" aria-hidden="true"></span></div>`).join('')}</div>
      <div class="fld" style="margin-top:14px"><label class="f" for="hvNewSide">${t.newGroupL}</label><input type="text" id="hvNewSide" dir="auto" autocomplete="off"></div>
      <button type="button" class="btn primary block" id="hvSideOk" disabled>${t.save}</button>`);
    const pick = v => { gEdit.side = v; closeSheet(); draw(); };
    $('#sheetB').querySelectorAll('[data-c]').forEach(c => { c.onclick = () => pick(c.dataset.c); c.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pick(c.dataset.c); } }; });
    $('#hvNewSide').oninput = e => { $('#hvSideOk').disabled = !e.target.value.trim(); };
    $('#hvSideOk').onclick = () => { const v = $('#hvNewSide').value.trim(); if (v) pick(v); };
  }
  async function removeGuest(g) {
    if (!armed) { armed = true; draw(); clearTimeout(armTimer); armTimer = setTimeout(() => { armed = false; if (cur().v === 'guest') draw(); }, 3000); return; }
    armed = false; clearTimeout(armTimer);
    const { error } = await sb.from('guests').delete().eq('id', g.id);
    if (error) { toast(t.rmErr); draw(); return; }
    toast(t.removed(g.name)); await loadGuests(); back();
  }

  // =====================================================================
  // 11d Add guests (the + sheet): contacts (where the browser has the picker), type them in (24l), Excel, paste
  // =====================================================================
  const CONTACTS_OK = 'contacts' in navigator && 'ContactsManager' in window;
  function addSheet() {
    if (invitesLeft() === 0) { sheet(t.addGuests, `<h3 class="hv-h3">${t.fullH}</h3><p class="hv-sub">${t.fullP(ev.invite_limit)}</p><button type="button" class="btn secondary block" data-close>${t.close}</button>`); return; }
    const row = (id, icon, h, s) => `<button type="button" class="line" id="${id}"><i class="i ${icon}"></i><span class="l"><b>${h}</b><span class="t-small">${s}</span></span><i class="i i-chev"></i></button>`;
    const left = invitesLeft();
    sheet(t.addGuests, `<div class="lines add-rows">${CONTACTS_OK ? row('aCt', 'i-people', t.gsFrom, t.gsFromS) : ''}${row('aType', 'i-pen', t.gsType, t.gsTypeS)}
      <label class="line"><input type="file" id="aFile" accept=".xlsx,.xls,.csv,.docx"><i class="i i-upload"></i><span class="l"><b>${t.gsXls}</b><span class="t-small">${t.gsXlsS}</span></span><i class="i i-chev"></i></label>
      ${row('aPaste', 'i-list', t.pasteH, t.gsPasteS)}</div>${left != null ? `<p class="foot-note hv-left">${esc(t.leftAfter(left))}</p>` : ''}`);
    if ($('#aCt')) $('#aCt').onclick = pickContacts;
    $('#aType').onclick = () => { closeSheet(); addDraft = null; show('add', { ev: ev.id }); };
    $('#aFile').onchange = async e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      try { const r = await App.parseGuestFile(f); if (!r.rows.length) { closeSheet(); toast(t.fileNone); return; } pasteSheet(r); } catch (err) { why(err); closeSheet(); toast(t.fileErr); }
    };
    $('#aPaste').onclick = () => pasteSheet();
  }
  // add parsed or picked rows ({ name, phone, seats }); numbers already on the list are skipped → how many were added, or -1
  async function addRows(list) {
    const seen = new Set(guests.map(g => g.phone)), rows = list.filter(g => !seen.has(g.phone) && seen.add(g.phone)).map(g => ({ ...g, event_id: ev.id, side: mySide || null }));
    if (!rows.length) return 0;
    const { data, error } = await sb.from('guests').upsert(rows, { onConflict: 'event_id,phone', ignoreDuplicates: true }).select('id');
    if (error) { toast(/limit/i.test(error.message || '') ? t.noPkg : t.addErr); return -1; }
    (data || []).forEach(r => { selfIds.add(r.id); fresh.set(r.id, Date.now()); });
    toast(t.addedN((data || []).length)); await loadGuests(); return (data || []).length;
  }
  function pasteSheet(pre) {
    let parsed = pre || null;
    sheet(t.pasteH, `<p class="t-small" style="margin:0 0 10px">${t.pasteP}</p><textarea id="pText" rows="6" dir="auto" placeholder="${esc(t.pastePh)}"></textarea>
      <div style="margin:10px 0"><button type="button" class="btn secondary" id="pCheck">${t.check}</button></div><div id="pOut"></div>`);
    const out = () => {
      if (!parsed) return;
      $('#pOut').innerHTML = (parsed.rows.length ? `<p class="t-body">${t.found(parsed.rows.length)}</p><div class="mlist">${parsed.rows.map(g => `<div class="mrow"><span class="m-main"><span class="m-n" dir="auto">${esc(g.name)}</span><span class="m-s"><span dir="ltr">${esc(App.prettyPhone(g.phone))}</span> · ${esc(cw(g.seats))}</span></span></div>`).join('')}</div>` : '')
        + (parsed.bad.length ? `<div class="panel flat tone-wait badl"><p class="t-tone">${t.badL}</p><ul>${parsed.bad.slice(0, 30).map(l => `<li><bdi>${esc(l)}</bdi></li>`).join('')}</ul></div>` : '')
        + (parsed.rows.length ? `<button type="button" class="btn primary block" id="pAdd" style="margin-top:12px">${t.addN(parsed.rows.length)}</button>` : '');
      if ($('#pAdd')) $('#pAdd').onclick = async () => { const b = $('#pAdd'); b.setAttribute('aria-busy', 'true'); const r = await addRows(parsed.rows); if (b.isConnected) b.removeAttribute('aria-busy'); if (r < 0) return; if (r === 0) toast(t.addedN(0)); closeSheet(); filter = 'all'; query = ''; draw(); };
    };
    $('#pCheck').onclick = () => { parsed = App.parseGuestLines($('#pText').value.split(/\n/)); if (!parsed.rows.length && !parsed.bad.length) return; out(); };
    out();
  }
  let picked = [];
  async function pickContacts() {
    closeSheet();
    let got;
    try { got = await navigator.contacts.select(['name', 'tel'], { multiple: true }); } catch (err) { why(err); toast(t.ctErr); return; }
    if (!got || !got.length) return;
    const have = new Set(guests.map(g => g.phone)), seen = new Set();
    picked = got.map(c => {
      const phone = (c.tel || []).map(App.normPhone).find(p => p.length >= 10 && p.length <= 15) || '';
      const name = String((c.name || [])[0] || '').trim() || (phone ? App.prettyPhone(phone) : '');
      return { name, phone, seats: 1, dup: have.has(phone), on: !have.has(phone) };
    }).filter(c => c.phone && !seen.has(c.phone) && seen.add(c.phone));
    if (!picked.length) { toast(t.ctNone); return; }
    const n = () => picked.filter(c => c.on && !c.dup).length;
    sheet(t.ctH, `<div class="mlist">${picked.map((c, i) => c.dup ? `<div class="mrow ct-row off"><span class="m-main"><span class="m-n" dir="auto">${esc(c.name)}</span><span class="m-s">${t.already}</span></span></div>`
      : `<label class="mrow ct-row"><span class="m-main"><span class="m-n" dir="auto">${esc(c.name)}</span><span class="m-s"><span dir="ltr">${esc(App.prettyPhone(c.phone))}</span></span></span><span class="ct-cb"><input type="checkbox" data-ct="${i}" ${c.on ? 'checked' : ''} aria-label="${esc(c.name)}"><i class="i i-check" aria-hidden="true"></i></span></label>`).join('')}</div>
      <button type="button" class="btn primary block" id="ctAdd" style="margin-top:12px">${t.addN(n())}</button>`);
    $('#sheetB').querySelectorAll('[data-ct]').forEach(x => x.onchange = () => { picked[+x.dataset.ct].on = x.checked; const k = n(), b = $('#ctAdd'); b.textContent = t.addN(k); b.disabled = !k; });
    $('#ctAdd').onclick = async () => { const b = $('#ctAdd'); b.setAttribute('aria-busy', 'true'); const r = await addRows(picked.filter(c => c.on && !c.dup).map(({ name, phone, seats: s }) => ({ name, phone, seats: s }))); if (b.isConnected) b.removeAttribute('aria-busy'); if (r < 0) return; picked = []; closeSheet(); filter = 'all'; query = ''; draw(); };
  }

  // =====================================================================
  // 24l Add a guest: name, phone number, can they bring people (how many more), group → back on the event page,
  // where the new guest shows as "Sending…" (24m). Our team sends the invitation.
  // =====================================================================
  let addDraft = null;
  VIEWS.add = () => {
    const d = addDraft = addDraft || { name: '', phone: '', bring: false, extra: 1, side: '', note: '' };
    const groups = [...new Set([...GROUPS[lang], ...sidesOf()])];
    const stepper = `<div class="stepline"><span>${t.upTo}</span><div class="stepper" id="adStep" role="group" aria-label="${esc(t.upTo)}"><button type="button" data-d="-1" aria-label="${esc(t.less)}" ${d.extra <= 1 ? 'disabled' : ''}>−</button><output aria-live="polite">${d.extra}</output><button type="button" data-d="1" aria-label="${esc(t.more)}" ${d.extra >= App.MAX_EXTRAS ? 'disabled' : ''}>+</button></div></div>`;
    const radio = (id, on, h, s, extra = '') => `<div class="choice" role="radio" tabindex="0" data-c="${id}" aria-checked="${on}"><span class="ch-main"><span class="ch-t">${h}</span><span class="ch-s">${s}</span></span><span class="radio" aria-hidden="true"></span>${extra}</div>`;
    return { title: t.guestsH, docTitle: t.addH,
      main: `<h1 class="hv-h1">${t.addH}</h1>
        <div class="fld"><label class="f" for="adName">${t.nameL}</label><input type="text" id="adName" dir="auto" autocomplete="off" value="${esc(d.name)}"></div>
        <div class="fld"><label class="f" for="adPhone">${t.phoneL}</label><input type="tel" id="adPhone" dir="ltr" inputmode="tel" placeholder="+965 9XXX XXXX" autocomplete="off" value="${esc(d.phone)}"></div>
        <div class="fld"><p class="f">${t.canBringQ}</p><div class="choices" role="radiogroup" aria-label="${esc(t.canBringQ)}">${radio('one', !d.bring, t.justThem, t.justThemP)}${radio('more', d.bring, t.canBring, t.canBringP, d.bring ? stepper : '')}</div></div>
        ${mySide ? '' : `<div class="fld"><p class="f">${t.group}</p><div class="gchips" role="group" aria-label="${esc(t.group)}">${groups.map(s => `<button type="button" class="gchip" data-side="${esc(s)}" aria-pressed="${d.side === s}">${bdi(s)}</button>`).join('')}</div></div>`}
        <div class="fld"><label class="f" for="adNote">${t.noteL}</label><input type="text" id="adNote" dir="auto" maxlength="200" autocomplete="off" placeholder="${esc(t.notePh)}" value="${esc(d.note)}"></div>`,
      foot: `<button type="button" class="btn primary block" id="adGo">${t.addGuest}</button>`,
      bind: () => {
        $('#adName').oninput = e => { d.name = e.target.value; };
        $('#adPhone').oninput = e => { d.phone = e.target.value; };
        $('#adNote').oninput = e => { d.note = e.target.value; };
        $('#hMain').querySelectorAll('[role="radio"][data-c]').forEach(c => {
          const pick = e => { if (e && e.target.closest && e.target.closest('.stepline')) return; d.bring = c.dataset.c === 'more'; draw(); };
          c.onclick = pick; c.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pick(); } };
        });
        $('#hMain').querySelectorAll('#adStep [data-d]').forEach(b => b.onclick = e => { e.stopPropagation(); d.extra = Math.max(1, Math.min(App.MAX_EXTRAS, d.extra + +b.dataset.d)); draw(); });
        $('#hMain').querySelectorAll('[data-side]').forEach(b => b.onclick = () => { d.side = d.side === b.dataset.side ? '' : b.dataset.side; draw(); });
        $('#adGo').onclick = async () => {
          const name = d.name.trim(), phone = normPhone(d.phone), n = d.bring ? 1 + d.extra : 1;
          if (!name) { toast(t.typeName); $('#adName').focus(); return; }
          if (phone.length < 10) { toast(t.short); $('#adPhone').focus(); return; }
          if (ev.invite_limit != null && seats(guests) + n > ev.invite_limit) { toast(t.noPkg); return; }
          const b = $('#adGo'); b.setAttribute('aria-busy', 'true');
          const { data, error } = await sb.from('guests').insert({ event_id: ev.id, name, phone, seats: n, side: mySide || d.side || null, ...(d.note.trim() ? { note: d.note.trim().slice(0, 200) } : {}) }).select().single();
          if (b.isConnected) b.removeAttribute('aria-busy');
          if (error) { toast(error.code === '23505' ? t.dupNum : /limit/i.test(error.message || '') ? t.noPkg : t.addOneErr); return; }
          selfIds.add(data.id); fresh.set(data.id, Date.now()); addDraft = null; filter = 'all'; query = '';
          await loadGuests(); toast(t.added(name)); back();
        };
      } };
  };

  // =====================================================================
  // 24f Your package
  // =====================================================================
  let pkgUp = null;
  VIEWS.package = () => {
    const used = seats(guests), lim = ev.invite_limit, pk = ev.package, door = hasDoor(ev);
    const pr = { basic: 15000, plus: 35000, premium: 75000 }, up = [];
    if (pk && !mySide) {
      if (pk === 'basic') up.push(['plus', PKN.plus[lang === 'ar' ? 1 : 0], t.upPkg.plus, pr.plus - pr.basic]);
      if (pk !== 'premium') up.push(['premium', PKN.premium[lang === 'ar' ? 1 : 0], t.upPkg.premium, pr.premium - pr[pk]]);
      if (pk === 'basic' && !door) up.push(['door', t.doorOnly, t.upPkg.door, pkgUp || 10000]);
    }
    if (pk === 'basic' && !door && pkgUp == null) price('door_addon').then(v => { pkgUp = v; if (cur().v === 'package') draw(); });

  }

  function bellDot() { const n = notifyOn() ? unread() : 0; $('#hDot').hidden = !n; $('#hBell').setAttribute('aria-label', n ? `${t.tabUpdates} (${n})` : t.tabUpdates); }
  let upSeen = 0;
  VIEWS.updates = () => {
    if (!ups) { loadUpdates().then(() => { if (cur().v === 'updates') { upSeen = seenAt(); ls.set('updates-seen', String(Date.now())); draw(); } }); return { title: t.home, docTitle: t.tabUpdates, main: `<h1 class="hv-h1">${t.tabUpdates}</h1>` }; }

    const row = u => {
      const isNew = u.at && +new Date(u.at) > upSeen;
      let title, sub, letter, tone, attr;
      if (u.kind === 'reply') {

        title = t.upInvited(`⁨${e.title || ''}⁩`); sub = e.starts_at ? dayMon(e.starts_at) : ''; letter = e.title || '?'; tone = 'wait'; attr = `data-tok="${esc(u.i.token)}"`;
      }
      return `<button type="button" class="hv-up row-link${isNew ? ' new' : ''}" ${attr}>${arch(letter, tone)}<span class="hv-upm"><span class="hv-upt" dir="${lang === 'ar' ? 'rtl' : 'ltr'}">${esc(title)}</span>${sub ? `<span class="hv-ups">${bdi(sub)}</span>` : ''}</span><span class="hv-upe"><span>${esc(ago(u.at))}</span>${isNew ? `<span class="hv-updot" aria-label="${t.upNew}"></span>` : ''}</span></button>`;
    };
    return { title: t.home, docTitle: t.tabUpdates,
      main: `<h1 class="hv-h1">${t.tabUpdates}</h1>${ups.length ? `<div class="hv-ups-list">${ups.map(row).join('')}</div>` : `<p class="hv-sub">${t.upEmpty}</p>`}`,
      bind: () => {
        $('#hMain').querySelectorAll('[data-ev]').forEach(b => b.onclick = () => { upSeen = 0; openEvent(b.dataset.ev); });
        $('#hMain').querySelectorAll('[data-ready]').forEach(b => b.onclick = () => { upSeen = 0; show('review', { ev: b.dataset.rev, r: b.dataset.ready }); });
        $('#hMain').querySelectorAll('[data-tok]').forEach(b => b.onclick = () => { location.href = `invite.html?t=${encodeURIComponent(b.dataset.tok)}`; });
      } };
  };

  // =====================================================================
  // 24q Support
  // =====================================================================
  VIEWS.support = () => {
    return { brand: true, tab: 'support', docTitle: t.tabSupport,
      main: `<div class="hv-pt"><h1 class="hv-h1">${t.tabSupport}</h1><p class="hv-sub">${t.supportP}</p></div>
        <div class="hv-lines flat"><a class="hv-line" ${teamLink(t.supportWa)}><span class="l">${t.supportWaL}</span><span class="v">${t.supportChat}</span>${chev()}</a>
        <button type="button" class="hv-line" id="hvFaq"><span class="l">${t.supportFaq}</span>${chev()}</button></div>`,
      bind: () => { $('#hvFaq').onclick = () => App.openHelp(); } };
  };

  // =====================================================================
  // 24b Account: your details, preferences (language, notifications, appearance), payments, privacy, about, log out
  // Notifications = the dot on the bell (saved on the account: set_notify_v2). Payment methods: how paying works (no cards
  // are kept). Receipts: every order on the events you host (event_orders_v2). Privacy settings: what we keep and who sees it.
  // =====================================================================
  let receipts = null, rcLoading = null, rcErr = false;
  function loadReceipts() {
    if (rcLoading) return rcLoading;
    const mine = events.filter(e => e._role === 'host' && e.status !== 'draft');
    return (rcLoading = Promise.all(mine.map(e => sb.rpc('event_orders_v2', { p_event: e.id }).then(r => { if (r.error) throw r.error; return (r.data || []).map(o => ({ ...o, e })); })))
      .then(l => { receipts = l.flat().sort((a, b) => +new Date(b.paid_at || b.created_at) - +new Date(a.paid_at || a.created_at)); rcErr = false; })
      .catch(() => { rcErr = true; })
      .finally(() => { rcLoading = null; redrawIf('account', 'receipts'); }));
  }
  const methodName = m => m === 'card' ? t.card : m === 'knet' ? t.knet : '';
  const themeNow = () => { const d = document.documentElement.dataset.theme; return d === 'dark' ? 'dark' : d === 'auto' ? 'auto' : 'light'; };
  VIEWS.account = () => {
    const p = profile || {}, ph = p.phone || myPhone, em = p.email || myEmail;
    const L = (label, value, id, href, ltr) => href ? `<a class="hv-line" href="${href}"><span class="l">${label}</span>${value ? `<span class="v"${ltr ? ' dir="ltr"' : ''}>${esc(value)}</span>` : ''}${chev()}</a>`
      : id ? `<button type="button" class="hv-line" id="${id}"><span class="l">${label}</span>${value ? `<span class="v"${ltr ? ' dir="ltr"' : ''}>${esc(value)}</span>` : ''}${chev()}</button>`
      : `<div class="hv-line"><span class="l">${label}</span><span class="v"${ltr ? ' dir="ltr"' : ''}>${esc(value)}</span></div>`;
    const tileT = (k, label) => `<button type="button" class="hv-theme" role="radio" aria-checked="${themeNow() === k}" data-th="${k}"><span class="hv-thb ${k}"><span>Aa</span></span><span class="hv-thl">${label}</span></button>`;
    if (!receipts && !rcLoading && !rcErr) loadReceipts();
    const lastPaid = (receipts || []).find(o => o.status === 'paid' && o.method);
    const notifOn = notifyOn();
    return { title: t.home, docTitle: t.account,
      main: `<h1 class="hv-h1">${t.account}</h1>
        <h2 class="hv-lh">${t.secDetails}</h2><div class="hv-lines flat">${L(t.nameL, p.name || t.notSet, 'acName')}${ph ? L(t.phoneL, App.prettyPhone(ph), null, null, true) : ''}${em ? L(t.email, em, null, null, true) : ''}</div>
        <h2 class="hv-lh">${t.secPrefs}</h2><div class="hv-lines flat">${L(t.language, t.langName, 'acLang')}<button type="button" class="hv-line" id="acNotif" role="switch" aria-checked="${notifOn}"><span class="l">${t.notif}<small class="hv-lsub">${t.notifP}</small></span><span class="v">${notifOn ? t.on : t.off}</span>${chev()}</button></div>
        <p class="hv-lab ink">${t.appearance}</p><div class="hv-themes" role="radiogroup" aria-label="${esc(t.appearance)}">${tileT('light', t.light)}${tileT('dark', t.dark)}${tileT('auto', t.auto)}</div>
        <h2 class="hv-lh">${t.secPay}</h2><div class="hv-lines flat">${L(t.payMethods, lastPaid ? methodName(lastPaid.method) : '', 'acPm')}${L(t.receipts, '', 'acRc')}</div>
        <h2 class="hv-lh">${t.secPrivacy}</h2><div class="hv-lines flat">${L(t.privSet, '', 'acPriv')}${L(t.deleteMine, '', null, 'delete-account.html')}</div>
        <h2 class="hv-lh">${t.secAbout}</h2><div class="hv-lines flat">${L(t.aboutSina, '', null, `index.html?lang=${lang}`)}${L(t.termsOfUse, '', null, `terms.html?lang=${lang}`)}${L(t.privacy, '', null, `privacy.html?lang=${lang}`)}</div>
        <button type="button" class="btn secondary block" id="acOut">${t.logOut}</button><p class="hv-ver">${esc(t.versionLine('1.0'))}</p>`,
      bind: () => {
        $('#acLang').onclick = toggleLang;
        $('#acPm').onclick = () => show('paymethods');
        $('#acRc').onclick = () => { if (rcErr) { rcErr = false; receipts = null; } show('receipts'); };
        $('#acPriv').onclick = () => show('privacy');
        $('#acNotif').onclick = async () => {
          const was = notifyOn(), b = $('#acNotif');
          profile = { ...(profile || {}), notify: !was }; draw();   // right away; put back if it doesn't save
          b.setAttribute('aria-busy', 'true');
          const r = await sb.rpc('set_notify_v2', { p_on: !was });
          if (r.error) { profile = { ...profile, notify: was }; toast(t.cantSave(why(r.error))); }
          else { profile = { ...profile, ...(r.data || {}) }; toast(t.notifSaved(!was)); }
          draw();
        };
        $('#acOut').onclick = () => SinaAuth.signOut('host.html');
        $('#hMain').querySelectorAll('[data-th]').forEach(b => b.onclick = () => { const k = b.dataset.th; document.documentElement.dataset.theme = k; ls.set('ui-theme', k); draw(); });
        $('#acName').onclick = () => {
          sheet(t.editName, `<div class="fld"><label class="f" for="acNm">${t.yourName}</label><input type="text" id="acNm" dir="auto" autocomplete="name" value="${esc(p.name || '')}"></div><button type="button" class="btn primary block" id="acNmOk">${t.save}</button>`);
          setTimeout(() => $('#acNm').focus(), 60);
          $('#acNmOk').onclick = async () => {
            const v = $('#acNm').value.trim(); if (!v) { $('#acNm').focus(); return; }
            const b = $('#acNmOk'); b.setAttribute('aria-busy', 'true');
            const r = await sb.rpc('save_profile_v2', { p_name: v, p_email: p.email && !myEmail ? p.email : null });
            b.removeAttribute('aria-busy');
            if (r.error) { toast(t.cantSave(why(r.error))); return; }
            profile = { ...profile, ...(r.data || {}), name: v }; closeSheet(); toast(t.saved); draw();
          };
        };
      } };
  };
  VIEWS.paymethods = () => ({ title: t.account, docTitle: t.payMethods,
    main: `<div class="hv-pt"><h1 class="hv-h1">${t.payMethods}</h1><p class="hv-sub">${t.pmP}</p></div>
      <div class="hv-lines flat"><div class="hv-line"><span class="l">${t.knet}<small class="hv-lsub">${t.knetS}</small></span></div><div class="hv-line"><span class="l">${t.card}<small class="hv-lsub">${t.cardS}</small></span></div></div>` });
  VIEWS.receipts = () => {
    if (!receipts && !rcLoading && !rcErr) loadReceipts();
    const rc = o => {
      const kind = o.kind === 'package' ? t.rcKind.package(pkgOf({ package: o.package }) || '') : (t.rcKind[o.kind] || o.kind);
      const when = dayMon(o.paid_at || o.created_at), tone = o.status === 'paid' ? 'ok' : o.status === 'failed' ? 'no' : '';
      return `<div class="hv-rc"><span class="l"><b>${esc(kind)}</b><small><bdi>${esc(evNameOf(o.e))}</bdi> · ${esc(when)}</small></span><span class="v"><b>${esc(App.kwd(o.amount_fils, lang))}</b><small class="${tone}">${esc([t.rcSt[o.status] || o.status, o.status === 'paid' ? methodName(o.method) : ''].filter(Boolean).join(' · '))}</small></span></div>`;
    };
    const list = (receipts || []).filter(o => o.status !== 'cancelled' && (o.status === 'paid' || o.amount_fils > 0));
    return { title: t.account, docTitle: t.receipts,
      main: `<div class="hv-pt"><h1 class="hv-h1">${t.receipts}</h1><p class="hv-sub">${t.rcP}</p></div>`
        + (rcErr ? `<p class="hv-empty">${t.rcErr}</p>` : !receipts ? '' : list.length ? `<div class="hv-rcs">${list.map(rc).join('')}</div>` : `<p class="hv-empty">${t.rcNone}</p>`) };
  };
  VIEWS.privacy = () => ({ title: t.account, docTitle: t.privSet,
    main: `<h1 class="hv-h1">${t.privSet}</h1>
      <div class="hv-pr"><h2>${t.prKeepH}</h2><p>${t.prKeep}</p><h2>${t.prSeeH}</h2><p>${t.prSee}</p><h2>${t.prCopyH}</h2><p>${t.prCopy}</p></div>
      <div class="hv-lines flat" style="margin-top:14px"><a class="hv-line" ${teamLink(t.prCopyWa)}><span class="l">${t.prCopyB}</span>${chev()}</a>
      <a class="hv-line" href="delete-account.html"><span class="l">${t.deleteMine}</span>${chev()}</a><a class="hv-line" href="privacy.html?lang=${lang}"><span class="l">${t.privacy}</span>${chev()}</a></div>` });
});
</script>
</body>
</html>
