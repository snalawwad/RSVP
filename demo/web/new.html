.sent-done .done-mark{width:72px;height:72px}

  // ---------- 07 When: a month calendar, start and end time, reply-by date ----------

  // Add parsed or picked rows ({ name, phone, seats }); skips numbers already on the list. → how many were added, or -1
  async function addRows(list) {
    const seen = new Set(guests.map(g => g.phone)), rows = list.filter(g => !seen.has(g.phone) && seen.add(g.phone)).map(g => ({ ...g, event_id: ev.id }));
    if (!rows.length) return 0;
    const { data, error } = await sb.from('guests').upsert(rows, { onConflict: 'event_id,phone', ignoreDuplicates: true }).select('*');
    if (error) { why(error); App.toast(t.addErr); return -1; }
    guests = guests.concat(data || []); App.toast(t.added((data || []).length)); return (data || []).length;
  }
  // 11e: the phone's contact picker, then the people picked as a checklist
  async function pickContacts() {
    App.closeSheet($('#sheet'));
    let got;
    try { got = await navigator.contacts.select(['name', 'tel'], { multiple: true }); } catch (err) { why(err); App.toast(t.ctErr); return; }
    if (!got || !got.length) return;
    const have = new Set(guests.map(g => g.phone)), seen = new Set();
    picked = got.map(c => {
      const phone = (c.tel || []).map(App.normPhone).find(p => p.length >= 10 && p.length <= 15) || '';
      const name = String((c.name || [])[0] || '').trim() || (phone ? App.prettyPhone(phone) : '');
      return { name, phone, seats: 1, dup: have.has(phone), on: !have.has(phone) };
    }).filter(c => c.phone && !seen.has(c.phone) && seen.add(c.phone));
    if (!picked.length) { App.toast(t.ctNone); return; }
    ctq = ''; go('contacts');

      const q = ctq.trim(), qd = App.asciiDigits(q).replace(/\D/g, '');

    if (draft.gExtra == null) { draft.gExtra = extra; draft.gBring = extra > 0; draft.gSide = g.side || ''; }
    const groups = [...new Set([...GROUPS[lang], ...guests.map(x => x.side).filter(Boolean)])];
    const stepper = `<div class="stepline"><span>${t.upTo}</span><div class="stepper" id="gStep" role="group" aria-label="${esc(t.upTo)}"><button type="button" data-d="-1" aria-label="${esc(t.less)}" ${draft.gExtra <= 1 ? 'disabled' : ''}>−</button><output aria-live="polite">${Math.max(1, draft.gExtra)}</output><button type="button" data-d="1" aria-label="${esc(t.more)}" ${draft.gExtra >= App.MAX_EXTRAS ? 'disabled' : ''}>+</button></div></div>`;
    frame(`<h1 class="scr-h">${editG ? t.editH : t.addH}</h1>
      ${field('gName', t.gName, draft.gName != null ? draft.gName : g.name, 'type="text" dir="auto" autocomplete="off"')}
      ${field('gPhone', t.gPhone, draft.gPhone != null ? draft.gPhone : (g.phone ? App.prettyPhone(g.phone) : ''), 'type="tel" dir="ltr" inputmode="tel" placeholder="+965 9XXX XXXX" autocomplete="off"')}
      <p class="sec-k">${t.bring}</p><div class="choices" role="radiogroup" aria-label="${esc(t.bring)}">${choice('one', !draft.gBring, t.justThem, t.justThemS)}${choice('more', draft.gBring, t.canBring, t.canBringS, '', '', draft.gBring ? stepper : '')}</div>
      <p class="sec-k">${t.group}</p><div class="gchips" role="group" aria-label="${esc(t.group)}">${groups.map(s => `<button type="button" class="gchip" data-side="${esc(s)}" aria-pressed="${draft.gSide === s}">${bdi(s)}</button>`).join('')}</div>`,
      foot('gSave', t.saveGuest, true, '', editG ? `<button type="button" class="btn danger block" id="gDel">${t.removeGuest}</button>` : ''), { title: t.guestsH });
    const keep = () => { draft.gName = $('#gName').value; draft.gPhone = $('#gPhone').value; };
    bindChoices(k => { keep(); draft.gBring = k === 'more'; if (draft.gBring && draft.gExtra < 1) draft.gExtra = 1; drawGuest(); });
    document.querySelectorAll('#gStep [data-d]').forEach(b => b.onclick = e => { e.stopPropagation(); keep(); draft.gExtra = Math.max(1, Math.min(App.MAX_EXTRAS, draft.gExtra + +b.dataset.d)); drawGuest(); });
    document.querySelectorAll('[data-side]').forEach(b => b.onclick = () => { keep(); draft.gSide = draft.gSide === b.dataset.side ? '' : b.dataset.side; drawGuest(); });
    $('#gSave').onclick = async () => {
      keep();
      const name = draft.gName.trim(), phone = App.normPhone(draft.gPhone), seats = draft.gBring ? 1 + draft.gExtra : 1;
      if (!name) { App.toast(t.typeName); $('#gName').focus(); return; }
      if (phone.length < 10) { App.toast(t.short); $('#gPhone').focus(); return; }
      const row = { name, phone, seats, side: draft.gSide || null };
      const b = $('#gSave'); b.setAttribute('aria-busy', 'true');
      const r = editG ? await sb.from('guests').update(row).eq('id', editG.id).select('*').single() : await sb.from('guests').insert({ ...row, event_id: ev.id }).select('*').single();
      b.removeAttribute('aria-busy');
      if (r.error) { why(r.error); App.toast(r.error.code === '23505' ? t.dup : t.addErr); return; }
      guests = editG ? guests.map(x => x.id === editG.id ? r.data : x) : guests.concat(r.data);
      draft = {}; editG = null; go('guests');
    };
    if ($('#gDel')) $('#gDel').onclick = async () => {
      const { error } = await sb.from('guests').delete().eq('id', editG.id);
      if (error) { App.toast(t.saveErr); return; }
      guests = guests.filter(x => x.id !== editG.id); draft = {}; editG = null; go('guests');
    };
  }

  // ---------- P1 / P1a Pick a package ----------
  async function loadQuotes(door) {
    const out = {};
    if (!PK) { const r = await sb.from('packages').select('*'); PK = Object.fromEntries((r.data || []).map(p => [p.code, p])); }
    await Promise.all(['basic', 'plus', 'premium'].map(async k => { const r = await rpc('quote_v2', { p_event: ev.id, p_package: k, p_door: k === 'basic' ? !!door : false }); if (!r.error && r.data) out[k] = { ...r.data, door_included: PK[k] ? !!PK[k].door_included : k !== 'basic' }; }));
    quotes = out; return out;
  }
  async function drawPackage() {
    if (!Object.keys(quotes).length) { frame(`<h1 class="scr-h">${t.pkgH}</h1><p class="scr-p">…</p>`, ''); await loadQuotes(sel.door); }
    const want = qs.get('package') || ls.get('new-package');
    if (!sel.pkg && want && quotes[want] && quotes[want].fits) sel.pkg = want;
    if (sel.pkg && quotes[sel.pkg] && !quotes[sel.pkg].fits) sel.pkg = null;
    if (!sel.pkg) sel.pkg = ['basic', 'plus', 'premium'].find(k => quotes[k] && quotes[k].fits) || null;
    const n = (quotes.basic || quotes.plus || {}).guest_count ?? seatsOf();
    const base = k => ((quotes[k] || {}).items || []).find(i => i.kind === 'package') || {};
    const doorIt = q => (q.items || []).find(i => i.kind === 'door_addon');
    const DS = { basic: t.doorNo, plus: t.doorYes, premium: t.doorDesign };
    const rows = ['basic', 'plus', 'premium'].filter(k => quotes[k]).map(k => { const q = quotes[k], lim = q.invite_limit;
      return choice(k, sel.pkg === k, pkgName(k), `${lim ? t.upToN(lim) + '<br>' : ''}${DS[k]}${q.fits ? '' : `</span><span class="ch-why">${t.tooSmall(n, lim)}`}`, App.kwd(base(k).amount_fils, lang), '', '', !q.fits); }).join('');
    const incl = sel.pkg && quotes[sel.pkg] && quotes[sel.pkg].door_included;
    const addonP = App.kwd(10000, lang);
    const doorRow = !sel.pkg ? '' : incl ? `<div class="line"><i class="i i-door"></i><span class="l"><b style="font-weight:500">${t.doorInc}</b><br><span class="t-small">${t.doorIncS}</span></span><i class="i i-check"></i></div>`
      : `<label class="check-row line"><i class="i i-door"></i><span class="l">${t.addDoorT}<br><span class="t-small">${t.addDoorS(addonP)}</span></span><input type="checkbox" id="pDoor" ${sel.door ? 'checked' : ''}></label>`;
    const tot = sel.pkg ? quotes[sel.pkg].total_fils : 0;
    frame(`<h1 class="scr-h">${t.pkgH}</h1><p class="scr-p">${t.pkgP(n)}</p><div class="choices" role="radiogroup" aria-label="${esc(t.pkgH)}">${rows}</div>${doorRow}`,
      foot('goNext', sel.pkg ? t.choosePkg(pkgName(sel.pkg), App.kwd(tot, lang)) : t.pickPkg, !!sel.pkg));
    bindChoices(k => { sel.pkg = k; if (quotes[k].door_included) sel.door = false; drawPackage(); });
    if ($('#pDoor')) $('#pDoor').onchange = async e => { sel.door = e.target.checked; await loadQuotes(sel.door); drawPackage(); };
    $('#goNext').onclick = async () => { if (await save({ package: sel.pkg, door_addon: !!sel.door && !quotes[sel.pkg].door_included })) { ls.set('new-package', sel.pkg); go('send'); } };
  }

  // ---------- S1 How we send ----------
  const AR_DEFAULT = 'حياكم الله {الاسم}\n\nنتشرف بدعوتكم لحضور {المناسبة} يوم {التاريخ} الساعة {الوقت}.\n\nلتأكيد الحضور أو الاعتذار:\n{الرابط}';
  const tplOf = e => e.message_template || (e.lang === 'en' ? App.DEFAULT_TEMPLATE_EN : AR_DEFAULT);
  function drawSend() {
    draft.ch = draft.ch || (ev.send_channel === 'sms' ? 'sms' : 'whatsapp');
    draft.tpl = draft.tpl != null ? draft.tpl : tplOf(ev);
    const tok = ev.lang === 'en' ? T.en.tplHint : T.ar.tplHint;
    frame(`<h1 class="scr-h">${t.sendH}</h1><p class="sec-k">${t.sendK}</p>
      <div class="lines" role="radiogroup" aria-label="${esc(t.sendH)}">${['whatsapp', 'sms'].map(k => `<div class="line choice-line" role="radio" tabindex="0" data-c="${k}" aria-checked="${draft.ch === k}" style="cursor:pointer"><i class="i ${k === 'sms' ? 'i-env' : 'i-whatsapp'}"></i><span class="l">${k === 'sms' ? t.sms : t.wa}<br><span class="t-small">${k === 'sms' ? t.smsS : t.waS(App.BRAND[lang])}</span></span><span class="radio" aria-hidden="true"></span></div>`).join('')}</div>
      ${CONFIG.WHATSAPP_AUTO ? '' : `<p class="note-box">${t.byHandNote}</p>`}
      <div class="fld"><label class="f" for="sTpl">${t.msg}</label><textarea id="sTpl" rows="5" dir="auto">${esc(draft.tpl)}</textarea><p class="help" dir="auto">${esc(tok)}</p></div>`, foot('goNext', t.saveSend));
    document.querySelectorAll('.choice-line').forEach(c => { const pick = () => { draft.tpl = $('#sTpl').value; draft.ch = c.dataset.c; drawSend(); }; c.onclick = pick; c.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pick(); } }; });
    $('#sTpl').oninput = e => { draft.tpl = e.target.value; };
    $('#goNext').onclick = async () => {
      const tpl = $('#sTpl').value.trim();
      const patch = { send_channel: draft.ch };
      if (tpl && tpl !== tplOf({ lang: ev.lang })) patch.message_template = tpl;
      if (await save(patch)) { draft = {}; go('review'); }
    };
  }

  // ---------- 12 Review and send ----------
  function drawReview() {
    const q = quotes[ev.package] || {}, inc = q.door_included;
    const when = ev.starts_at ? `${fmtShort(ev.starts_at)}, ${App.fmtTime(ev.starts_at, lang)}` : t.notSet;
    const L = (l, v, cls = '') => `<div class="line"><span class="l">${l}</span><span class="v ${cls}" dir="auto">${v}</span></div>`;
    frame(`<h1 class="scr-h">${t.revH}</h1><div class="lines">
      ${L(t.rEvent, esc(ev.headline || ev.title))}${L(t.rWhen, esc(when))}${L(t.rWhere, esc(ev.venue || t.notSet))}${L(t.rGuests, esc(t.guestsV(guests.length, seatsOf())))}
      ${L(t.rReply, esc(ev.rsvp_deadline ? fmtShort(ev.rsvp_deadline) : t.notSet))}${L(t.rPkg, esc(ev.package ? `${pkgName(ev.package)} · ${App.kwd((q.items || [{}])[0].amount_fils, lang)}` : t.notSet))}
      ${L(t.rDoor, inc || ev.door_addon ? t.on : t.off)}${L(t.rSend, ev.send_channel === 'sms' ? t.smsW : t.waW)}${L(t.rMsg, esc(App.fillTemplate(tplOf(ev), ev, { name: ev.lang === 'en' ? 'Dana' : 'دانة', seats: 2, token: 'preview' }).replace(/\s+/g, ' ')))}</div>`,
      foot('goNext', t.choosePay, !!ev.package, '', `<button type="button" class="btn quiet block" id="pvGuest">${t.previewGuest}</button>`));
    $('#pvGuest').onclick = previewGuest;
    $('#goNext').onclick = () => go('pay');
  }
  async function previewGuest() {
    const r = await rpc('preview_invite_v2', { p_event: ev.id });
    const inv = r.data || { event: ev, name: lang === 'ar' ? 'دانة' : 'Dana' };
    const e = { ...ev, ...(inv.event || {}) };
    sheet(t.previewH, `<p class="t-small" style="margin:0 0 12px">${t.sampleNote}</p>${card({ ...e, big: true, mark: true, withVenue: true })}`);
  }

  // ---------- P2 Pay ----------
  async function drawPay() {
    if (!quotes[ev.package]) await loadQuotes(ev.door_addon);
    const q = quotes[ev.package] || { items: [], total_fils: 0 };
    const pk = (q.items || []).find(i => i.kind === 'package') || {}, dr = (q.items || []).find(i => i.kind === 'door_addon');
    const L = (l, v, cls = '') => `<div class="line ${cls}"><span class="l">${l}</span><span class="v">${v}</span></div>`;
    frame(`<h1 class="scr-h">${t.payH}</h1><section class="paybox" aria-label="${esc(t.order)}"><p class="paybox-h">${t.order}</p><div class="lines">${L(`${esc(pkgName(ev.package))}`, App.kwd(pk.amount_fils, lang))}${L(t.rDoor, q.door_included ? t.included : dr ? App.kwd(dr.amount_fils, lang) : t.notAdded)}${L(t.total, App.kwd(q.total_fils, lang), 'tot')}</div></section>
      <section class="paybox"><p class="paybox-h">${t.payWith}</p><div class="lines" role="radiogroup" aria-label="${esc(t.payWith)}">${[['knet', t.knet], ['card', t.card]].map(([k, a]) => `<div class="line choice-line" role="radio" tabindex="0" data-c="${k}" aria-checked="${sel.method === k}" style="cursor:pointer"><span class="l">${a}</span><span class="radio" aria-hidden="true"></span></div>`).join('')}</div></section>`,
      foot('goPay', t.payBtn(App.kwd(q.total_fils, lang)), true, t.payNote));
    document.querySelectorAll('.choice-line').forEach(c => { const pick = () => { sel.method = c.dataset.c; drawPay(); }; c.onclick = pick; c.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pick(); } }; });
    $('#goPay').onclick = async () => {
      const b = $('#goPay'); b.setAttribute('aria-busy', 'true');
      const r = await rpc('start_checkout_v2', { p_event: ev.id, p_package: ev.package, p_door: !!ev.door_addon, p_method: sel.method });
      if (r.error) { b.removeAttribute('aria-busy'); App.toast(t.payErr); return; }
      ls.set('new-step-' + ev.id, 'pay');
      const c = await App.checkout(r.data);
      b.removeAttribute('aria-busy');
      App.toast(c.error === 'payments_not_connected' ? t.payOff : t.payErr);
    };
  }

  // ---------- 13 / 13a Sent: our team takes it from here ----------
  function drawSent() {
    if (ev.status === 'draft') {
      $('#root').innerHTML = `<div class="scr"><div class="fl-top"><p class="fl-title">${esc(ev.headline || ev.title)}</p></div><div class="scr-main centered"><h1 class="scr-h">${t.waitPayH}</h1><p class="scr-p">${t.waitPayP}</p></div><div class="scr-foot">${foot('goNext', t.payAgain)}</div></div>`;
      $('#goNext').onclick = () => go('pay'); return;
    }
    const door = !!(quotes[ev.package] && quotes[ev.package].door_included) || ev.door_addon || ev.package === 'plus' || ev.package === 'premium';
    const ch = ev.send_channel === 'sms' ? 'sms' : 'whatsapp';
    const hourKw = +new Date().toLocaleString('en-GB', { timeZone: 'Asia/Kuwait', hour: '2-digit', hour12: false });
    // Figma 13a (22 Nov evening): just the news to read, then Go to my event (no checklist to come back to)
    $('#root').innerHTML = `<div class="scr"><div class="fl-top"><p class="fl-title">${esc(ev.headline || ev.title)}</p></div>
      <div class="scr-main centered sent-done"><span class="done-mark"><i class="i i-check"></i></span><h1 class="scr-h">${t.doneH}</h1><p class="scr-p">${esc(t.doneP(guests.length, ch, hourKw < 16, door))}</p></div>
      <div class="scr-foot">${foot('goNext', t.goEvent)}</div></div>`;
    $('#goNext').onclick = () => { location.href = `host.html?event=${ev.id}`; };
    ls.set('new-step-' + ev.id, 'sent');
  }

  // ---------- sheet ----------
  function sheet(h, body) { $('#shH').textContent = h; $('#shBody').innerHTML = body; $('#sheet .sheet-x').setAttribute('aria-label', lang === 'ar' ? 'إغلاق' : 'Close'); App.openSheet($('#sheet')); }

  const DRAW = { name: drawName, when: drawWhen, where: drawWhere, team: drawTeam, design: drawDesign, style: drawStyle, language: drawLanguage, cover: drawCover, upload: drawUpload, ask: drawAsk, asked: drawAsked,
    guests: drawGuests, guest: drawGuest, contacts: drawContacts, package: drawPackage, send: drawSend, review: drawReview, pay: drawPay, sent: drawSent };
  function draw() { if (!ev && screen !== 'name') screen = 'name'; (DRAW[screen] || drawName)(); }
  function applyLang() { t = T[lang]; document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.title = App.brandTitle(t.title, lang); draw(); }

  document.title = App.brandTitle(t.title, lang);
  SinaAuth.mount($('#root'), { audience: 'host', start: qs.get('package') ? 'signup' : 'welcome', onLang: () => { lang = lang === 'ar' ? 'en' : 'ar'; ls.set('host-lang', lang); t = T[lang]; document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; },
    onReady: async (session, prof) => {
      me = prof;
      if (qs.get('package')) ls.set('new-package', qs.get('package'));
      const id = qs.get('event');
      if (id) {
        if (!(await load(id))) return;
        if (ev.status !== 'draft' && qs.get('step') !== 'sent') { location.replace(`host.html?event=${ev.id}`); return; }
        screen = ev.status !== 'draft' ? 'sent' : resumeAt();
      }
      draw();
    } });
});
</script>
</body>
